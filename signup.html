<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Hubator</title>
<link rel="stylesheet" href="css/style.css">

<meta name="description" content="Create a Hubator account for faster checkout and order tracking.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="favicon.ico">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Create account — Hubator">
<meta property="og:description" content="Create a Hubator account for faster checkout and order tracking.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
</head>
<body>

<div id="site-header"></div>

<main id="main-content">
  <div class="auth-wrap">
    <div class="auth-card">
      <h2 id="signup-heading" tabindex="-1" style="margin-bottom:6px;">Create your account</h2>
      <p id="signup-description" style="margin-bottom:26px;color:#6b7280;">Faster checkout, order history, saved addresses.</p>

      <form id="signup-form" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label for="signup-firstname">First name</label>
            <input id="signup-firstname" name="firstName" type="text" required autocomplete="given-name" placeholder="Arjun">
          </div>
          <div class="form-field">
            <label for="signup-lastname">Last name</label>
            <input id="signup-lastname" name="lastName" type="text" autocomplete="family-name" placeholder="Sharma">
          </div>
        </div>
        <div class="form-field">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" required autocomplete="email" placeholder="you@email.com">
        </div>
        <div class="form-field">
          <label for="signup-password">Password <span style="color:#9ca3af;font-size:0.78rem;font-weight:400">(minimum 8 characters)</span></label>
          <input id="signup-password" name="password" type="password" required autocomplete="new-password" placeholder="••••••••" minlength="8">
        </div>
        <div class="form-field">
          <label for="signup-confirm">Confirm password</label>
          <input id="signup-confirm" name="confirmPassword" type="password" required autocomplete="new-password" placeholder="••••••••">
        </div>

        <p id="signup-form-error" role="alert" style="display:none;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:0.5rem 0.75rem;font-size:0.85rem;margin-bottom:0.75rem;"></p>

        <button type="submit" id="signup-btn" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-switch" style="margin-top:20px;text-align:center;">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/maintenance.js"></script>
<script src="js/layout.js"></script>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
  if (isSignedIn()) {
    window.location.replace("index.html");
  }

  document.getElementById("signup-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    clearAuthError("signup-form");

    const form = event.currentTarget;
    const btn = document.getElementById("signup-btn");
    if (btn.disabled) return;

    const firstInput = document.getElementById("signup-firstname");
    const emailInput = document.getElementById("signup-email");
    const passwordInput = document.getElementById("signup-password");
    const confirmInput = document.getElementById("signup-confirm");

    const first = firstInput.value.trim();
    const last = document.getElementById("signup-lastname").value.trim();
    const email = emailInput.value.trim();
    const pass = passwordInput.value;
    const conf = confirmInput.value;

    function fail(message, input) {
      showAuthError("signup-form", message);
      input.focus();
    }

    if (!first) {
      fail("Please enter your first name.", firstInput);
      return;
    }

    emailInput.value = email;
    if (!email || !emailInput.validity.valid) {
      fail("Please enter a valid email address.", emailInput);
      return;
    }

    if (pass.length < 8) {
      fail("Password must be at least 8 characters.", passwordInput);
      return;
    }

    if (pass !== conf) {
      fail("Passwords do not match.", confirmInput);
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creating account…";
    form.setAttribute("aria-busy", "true");

    try {
      await signUp(`${first} ${last}`.trim(), email, pass);

      form.style.display = "none";
      document.querySelector(".auth-switch").style.display = "none";

      const heading = document.getElementById("signup-heading");
      const description = document.getElementById("signup-description");
      const emailText = document.createElement("strong");
      const signInLink = document.createElement("a");

      emailText.textContent = email;
      signInLink.href = "login.html";
      signInLink.textContent = "sign in";

      heading.textContent = "Check your inbox!";
      description.replaceChildren(
        document.createTextNode("We sent a verification link to "),
        emailText,
        document.createTextNode("."),
        document.createElement("br"),
        document.createTextNode("Click it to activate your account, then "),
        signInLink,
        document.createTextNode(".")
      );

      passwordInput.value = "";
      confirmInput.value = "";
      heading.focus();
    } catch (err) {
      showAuthError("signup-form", err.message || "Could not create your account. Please try again.");
      btn.disabled = false;
      btn.textContent = "Create account";
    } finally {
      form.removeAttribute("aria-busy");
    }
  });
</script>
</body>
</html>
