<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Hubator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-bar">
    <a href="index.html" class="logo">Hubator</a>
    <nav class="main-nav"><ul><li><a href="shop.html">Shop</a></li></ul></nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-link" aria-label="Cart">🛍️<span class="cart-count">0</span></a>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h2 style="margin-bottom:6px;">Create your account</h2>
      <p style="margin-bottom:26px;color:#6b7280;">Faster checkout, order history, saved addresses.</p>

      <form id="signup-form" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label for="signup-firstname">First name</label>
            <input id="signup-firstname" type="text" required autocomplete="given-name" placeholder="Arjun">
          </div>
          <div class="form-field">
            <label for="signup-lastname">Last name</label>
            <input id="signup-lastname" type="text" autocomplete="family-name" placeholder="Sharma">
          </div>
        </div>
        <div class="form-field">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" required autocomplete="email" placeholder="you@email.com">
        </div>
        <div class="form-field">
          <label for="signup-password">Password <span style="color:#9ca3af;font-size:0.78rem;font-weight:400">(minimum 8 characters)</span></label>
          <input id="signup-password" type="password" required autocomplete="new-password" placeholder="••••••••" minlength="8">
        </div>
        <div class="form-field">
          <label for="signup-confirm">Confirm password</label>
          <input id="signup-confirm" type="password" required autocomplete="new-password" placeholder="••••••••">
        </div>

        <p id="signup-form-error" role="alert" style="display:none;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:0.5rem 0.75rem;font-size:0.85rem;margin-bottom:0.75rem;"></p>

        <button type="submit" id="signup-btn" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-switch" style="margin-top:20px;text-align:center;">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© 2026 Hubator. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
  if (isSignedIn()) window.location.href = "index.html";

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearAuthError("signup-form");

    const first = document.getElementById("signup-firstname").value.trim();
    const last  = document.getElementById("signup-lastname").value.trim();
    const email = document.getElementById("signup-email").value.trim();
    const pass  = document.getElementById("signup-password").value;
    const conf  = document.getElementById("signup-confirm").value;

    if (!first) { showAuthError("signup-form", "Please enter your first name."); return; }
    if (pass.length < 8) { showAuthError("signup-form", "Password must be at least 8 characters."); return; }
    if (pass !== conf)   { showAuthError("signup-form", "Passwords do not match."); return; }

    const btn = document.getElementById("signup-btn");
    btn.disabled = true;
    btn.textContent = "Creating account…";

    try {
      await signUp(`${first} ${last}`.trim(), email, pass);
      window.location.href = "index.html";
    } catch (err) {
      showAuthError("signup-form", err.message);
      btn.disabled = false;
      btn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
