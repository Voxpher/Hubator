<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product — Hubator</title><link rel="stylesheet" href="/css/style.css?v=2">
<meta name="description" content="View product details, size guide and ordering information at Hubator.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.ico">
<meta property="og:title" content="Product — Hubator">
<meta property="og:description" content="View product details, size guide and ordering information at Hubator.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
</head>
<body><div id="site-header"></div>
<main><div class="wrap breadcrumb"><a href="/">Home</a> / <a href="/shop">Shop</a> / <span id="crumb-name">Product</span></div><div class="wrap pd-grid" id="pd-root" aria-live="polite"><p>Loading product details…</p></div></main>
<div id="site-footer"></div>
<script src="/js/maintenance.js"></script><script src="/js/layout.js"></script><script src="/js/config.js"></script><script src="/js/products.js"></script><script src="/js/cart.js"></script><script src="/js/auth.js"></script><script>
  const reference = productReferenceFromLocation(window.location);
  loadProducts().then(() => {
    const p = getProductFromReference(reference);
    const root = document.getElementById("pd-root");
    if (!p) { root.textContent = "That product is no longer available."; return; }
    document.title = p.name + " — Hubator";
    document.getElementById("crumb-name").textContent = p.name;
    const variants = p.variants && typeof p.variants.forEach === "function" ? Array.from(p.variants.values()).filter(Boolean) : [];
    const colors = [];
    variants.forEach(function(v) {
      if (v.color && !colors.some(function(c) { return c.name === v.color; })) {
        colors.push({ name: v.color, hex: v.colorHex || "" });
      }
    });
    const hasSizes = variants.some(function(v) { return !!v.size; });
    // Client-side fallback so swatches render even when a variant has no saved colorHex.
    const COLOR_HEX_FALLBACK = { "white":"#FFFFFF","off white":"#FAF9F6","cream":"#F5EFD9","beige":"#E8DCC8","tan":"#D2B48C","brown":"#7C4A2D","black":"#1A1A1A","charcoal":"#3C4043","grey":"#9AA0A6","gray":"#9AA0A6","navy":"#1F3A5F","blue":"#2563EB","sky blue":"#7DD3FC","teal":"#14B8A6","green":"#2F7D4F","olive":"#6B7A3A","yellow":"#FACC15","mustard":"#D4A017","orange":"#F97316","rust":"#B7410E","red":"#DC2626","maroon":"#7C2D3B","pink":"#F9A8D4","peach":"#FDBA99","purple":"#7C3AED","lavender":"#B57EDC" };
    const hexOf = function(c) {
      if (c && c.hex) return c.hex;
      return COLOR_HEX_FALLBACK[String(c && c.name ? c.name : "").trim().toLowerCase()] || "";
    };
    const mainImg = p.img ? p.img : (p.gallery && p.gallery.length > 0 ? p.gallery[0] : "");
    let html = '<div class="pd-gallery"><div class="pd-gallery-main"><img src="'
      + escapeHtml(safeProductImageUrl(mainImg)) + '" alt="' + escapeHtml(p.name) + '"></div>';
    if (p.gallery && p.gallery.length > 1) {
      html += '<div class="pd-gallery-thumbs">' + p.gallery.slice(1).map((url, i) =>
        '<div class="pd-gallery-thumb' + (i === 0 ? " active" : "") + '" data-url="' + escapeHtml(String(url))
        + '" style="background-image: url(\'' + escapeHtml(String(url)) + '\')" role="button" tabindex="0" aria-label="View image ' + (i + 2) + '"></div>').join("") + "</div>";
    }
    html += "</div>";
    html += '<div class="pd-info"><span class="product-cat">' + escapeHtml(p.category) + "</span>"
      + '<h1 style="font-size:2rem;">' + escapeHtml(p.name) + "</h1>"
      + '<div class="pd-price-row"><span class="pd-price" id="pd-price">' + fmt(p.price) + "</span>"
      + (p.oldPrice ? '<span class="price-old">' + fmt(p.oldPrice) + "</span>" : "")
      + "</div><p>" + escapeHtml(p.desc) + "</p>"
      + '<div id="pd-variants"></div>'
      + '<div class="pd-actions"><button class="btn btn-primary" id="pd-add" data-id="' + escapeHtml(p.id) + '">Add to cart</button>'
      + '<a href="#" class="btn btn-outline" id="pd-buy" data-id="' + escapeHtml(p.id) + '">Buy now</a></div>'
      + '<ul class="pd-meta"><li>Prices shown in Indian Rupees</li><li>Shipping is calculated securely at checkout</li></ul>'
      + "</div>";
    root.innerHTML = html;
    root.querySelectorAll(".pd-gallery-thumb").forEach(function(t) {
      const activate = function() {
        const main = root.querySelector(".pd-gallery-main img");
        const url = t.getAttribute("data-url");
        if (main && url) main.src = url;
        root.querySelectorAll(".pd-gallery-thumb").forEach(function(x) { x.classList.remove("active"); });
        t.classList.add("active");
      };
      t.addEventListener("click", activate);
      t.addEventListener("keydown", function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); } });
    });
    let selectedColor = colors.length === 1 ? colors[0].name : "";
    let selectedSize = "";

    function stockFor(v) { return v && v.stock != null ? v.stock : p.stock; }
    function variantsForColor(name) {
      return variants.filter(function(v) { return name ? v.color === name : true; });
    }
    function findVariant() {
      const list = variantsForColor(selectedColor);
      if (!hasSizes) {
        const inStock = list.filter(function(v) { return stockFor(v) > 0; });
        return (inStock.length ? inStock : list)[0] || null;
      }
      return list.find(function(v) { return v.size === selectedSize; }) || null;
    }
    function priceFor(v) { return v && v.priceOverride != null ? Number(v.priceOverride) : p.price; }
    function variantIdOf(v) { return v ? String(v._id || "") : ""; }

    function render() {
      const v = findVariant();
      const priceEl = document.getElementById("pd-price");
      if (priceEl) priceEl.textContent = fmt(v ? priceFor(v) : p.price);
      const addBtn = document.getElementById("pd-add");
      const buyBtn = document.getElementById("pd-buy");
      const inStock = v ? stockFor(v) > 0 : (variants.length === 0 ? (p.stock == null || p.stock > 0) : false);
      const usable = inStock && (!hasSizes || !!selectedSize) && (colors.length <= 1 || !!selectedColor);
      addBtn.disabled = !usable;
      addBtn.onclick = function() { addToCart(p.id, 1, variantIdOf(v)); };
      if (usable) {
        buyBtn.setAttribute("href", "/checkout");
        buyBtn.setAttribute("aria-disabled", "false");
        buyBtn.onclick = function() { addToCart(p.id, 1, variantIdOf(v)); };
      } else {
        buyBtn.setAttribute("href", "#");
        buyBtn.setAttribute("aria-disabled", "true");
        buyBtn.onclick = function(event) { event.preventDefault(); };
      }

      let out = "";
      if (colors.length > 1) {
        out += '<div class="variant-section"><span class="variant-label">Color'
          + (selectedColor ? '<strong>' + escapeHtml(selectedColor) + '</strong>' : "")
          + '</span><div class="variant-options" role="group" aria-label="Choose a colour">';
        colors.forEach(function(c) {
          const anyStock = variants.some(function(vv) { return vv.color === c.name && stockFor(vv) > 0; });
          const swatch = hexOf(c);
          out += '<button type="button" class="variant-chip' + (selectedColor === c.name ? " is-selected" : "") + (anyStock ? "" : " is-unavailable") + (swatch ? "" : " has-name") + '"'
            + (swatch ? ' style="--swatch:' + escapeHtml(swatch) + '"' : "")
            + ' data-color="' + escapeHtml(c.name) + '" title="' + escapeHtml(c.name) + (anyStock ? "" : " — out of stock") + '" aria-label="' + escapeHtml(c.name) + '" aria-pressed="' + (selectedColor === c.name ? "true" : "false") + '">'
            + (swatch ? "" : escapeHtml(c.name)) + "</button>";
        });
        out += "</div>";
        if (!selectedColor) out += '<p class="variant-hint">Choose a colour to see available sizes</p>';
        out += "</div>";
      }
      if (hasSizes) {
        const sizes = [];
        variantsForColor(selectedColor).forEach(function(vv) { if (vv.size && sizes.indexOf(vv.size) === -1) sizes.push(vv.size); });
        out += '<div class="variant-section"><span class="variant-label">Size'
          + (selectedSize ? '<strong>' + escapeHtml(selectedSize) + '</strong>' : "")
          + '</span><div class="variant-options" role="group" aria-label="Choose a size">';
        sizes.forEach(function(s) {
          const sv = variantsForColor(selectedColor).find(function(vv) { return vv.size === s; });
          const ok = sv && stockFor(sv) > 0;
          out += '<button type="button" class="size-chip' + (selectedSize === s ? " is-selected" : "") + (ok ? "" : " is-unavailable") + '"'
            + ' data-size="' + escapeHtml(s) + '" aria-pressed="' + (selectedSize === s ? "true" : "false") + '"'
            + (ok ? "" : ' title="Out of stock"') + ">" + escapeHtml(s) + "</button>";
        });
        out += "</div>";
        if (selectedColor || colors.length === 0) {
          if (!selectedSize) out += '<p class="variant-hint">Choose a size</p>';
          else if (selectedSize && v && stockFor(v) <= 0) out += '<p class="variant-unavailable">This combination is out of stock</p>';
        }
        out += "</div>";
      }
      const host = document.getElementById("pd-variants");
      host.innerHTML = out;
      host.querySelectorAll("[data-color]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          selectedColor = btn.getAttribute("data-color");
          selectedSize = "";
          render();
        });
      });
      host.querySelectorAll("[data-size]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          selectedSize = btn.getAttribute("data-size");
          render();
        });
      });
    }

    // Products with nothing meaningful to choose: preselect and hide the picker.
    if (colors.length <= 1 && !hasSizes) {
      if (colors.length === 1) selectedColor = colors[0].name;
      document.getElementById("pd-variants").style.display = "none";
    }
    render();
  }).catch(err => {
    console.error("[Hubator] product:", err);
    document.getElementById("pd-root").textContent = "We couldn't load this product. Please refresh and try again.";
  });
</script></body></html>
