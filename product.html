<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product — Hubator</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="wrap header-bar"><a href="index.html" class="logo">Hubator</a><nav class="main-nav"><ul><li><a href="index.html">Home</a></li><li><a href="shop.html" class="active">Shop</a></li></ul></nav><div class="header-actions"><a href="cart.html" class="icon-link" aria-label="Cart">🛍️<span class="cart-count">0</span></a></div></div></header>
<main><div class="wrap breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="crumb-name">Product</span></div><div class="wrap pd-grid" id="pd-root"><p>Loading product…</p></div></main>
<footer class="site-footer"><div class="wrap"><div class="footer-bottom"><span>© 2026 Hubator. All rights reserved.</span><span style="font-size:0.8rem;margin-left:1rem;"><a href="privacy-policy.html" style="color:#9ca3af;text-decoration:none;margin:0 0.4rem;">Privacy</a><a href="terms-conditions.html" style="color:#9ca3af;text-decoration:none;margin:0 0.4rem;">Terms</a><a href="shipping-policy.html" style="color:#9ca3af;text-decoration:none;margin:0 0.4rem;">Shipping</a><a href="refund-policy.html" style="color:#9ca3af;text-decoration:none;margin:0 0.4rem;">Refunds</a></span></div></div></footer>
<script src="js/config.js"></script><script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/auth.js"></script><script>
  const id = new URLSearchParams(location.search).get("id");
  loadProducts().then(() => { const p = getProductById(id); const root = document.getElementById("pd-root"); if (!p) { root.innerHTML = '<p>That product is no longer available.</p>'; return; } document.title = `${p.name} — Hubator`; document.getElementById("crumb-name").textContent = p.name; root.innerHTML = `<div class="pd-gallery"><div class="pd-gallery-main"><img src="${p.img}" alt="${p.name}"></div></div><div class="pd-info"><span class="product-cat">${p.category}</span><h1 style="font-size:2rem;">${p.name}</h1><div class="pd-price-row"><span class="pd-price">${fmt(p.price)}</span>${p.oldPrice ? `<span class="price-old">${fmt(p.oldPrice)}</span>` : ""}</div><p>${p.desc}</p><div class="pd-actions"><button class="btn btn-primary" onclick="addToCart('${p.id}')">Add to cart</button><a href="checkout.html" class="btn btn-outline" onclick="addToCart('${p.id}')">Buy now</a></div><ul class="pd-meta"><li>Prices shown in Indian Rupees</li><li>Shipping is calculated securely at checkout</li></ul></div>`; }).catch(err => { document.getElementById("pd-root").innerHTML = `<p>${err.message}</p>`; });
</script></body></html>
