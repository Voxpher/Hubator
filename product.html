<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Product — Hubator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-bar">
    <a href="index.html" class="logo">Hubator</span></a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="btn btn-outline btn-sm">Sign in</a>
      <a href="cart.html" class="icon-link" aria-label="Cart">🛍️<span class="cart-count">0</span></a>
    </div>
    <button class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</header>

<main>
  <div class="wrap breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="crumb-name">Product</span></div>

  <div class="wrap pd-grid" id="pd-root">
    <!-- filled by JS -->
  </div>

  <section class="section section-alt">
    <div class="wrap">
      <div class="section-head">
        <div><span class="eyebrow">You may also like</span><h2>Related products</h2></div>
      </div>
      <div class="product-grid" id="related-grid"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <div><a href="index.html" class="logo">Hubator</span></a></div>
      <div><h5>Shop</h5><ul><li><a href="shop.html">All products</a></li></ul></div>
      <div><h5>Company</h5><ul><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li></ul></div>
      <div><h5>Account</h5><ul><li><a href="login.html">Sign in</a></li><li><a href="cart.html">Cart</a></li></ul></div>
    </div>
    <div class="footer-bottom">
      <span>© 2026 Hubator. All rights reserved.</span>
      <span>Built with a static HTML template</span>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id") || 1;
  const p = getProductById(id) || PRODUCTS[0];
  document.getElementById("page-title").textContent = p.name + " — Hubator";
  document.getElementById("crumb-name").textContent = p.name;

  document.getElementById("pd-root").innerHTML = `
    <div class="pd-gallery">
      <div class="pd-gallery-main"><img id="main-img" src="${p.img}" alt="${p.name}"></div>
      <div class="pd-thumbs">
        <img src="${p.img}" class="active" onclick="document.getElementById('main-img').src=this.src">
        <img src="${p.img}" onclick="document.getElementById('main-img').src=this.src" style="filter:sepia(.15)">
        <img src="${p.img}" onclick="document.getElementById('main-img').src=this.src" style="filter:grayscale(.5)">
      </div>
    </div>
    <div class="pd-info">
      <span class="product-cat">${p.category}</span>
      <h1 style="font-size:2rem;">${p.name}</h1>
      <div>${"★".repeat(Math.round(p.rating))}${"☆".repeat(5-Math.round(p.rating))} <span style="color:var(--ink-soft);font-size:.85rem;">(${p.rating} · 128 reviews)</span></div>
      <div class="pd-price-row">
        <span class="pd-price">${fmt(p.price)}</span>
        ${p.oldPrice ? `<span class="price-old" style="font-size:1rem;">${fmt(p.oldPrice)}</span><span class="ticket on-sale">Sale</span>` : ""}
      </div>
      <p>${p.desc}</p>
      <div class="qty-row">
        <div class="qty-control">
          <button onclick="stepQty(-1)">−</button>
          <input id="qty-input" type="text" value="1" readonly>
          <button onclick="stepQty(1)">+</button>
        </div>
        <span style="font-family:var(--font-mono);font-size:.8rem;color:var(--sage);">In stock</span>
      </div>
      <div class="pd-actions">
        <button class="btn btn-primary" onclick="addToCart(${p.id}, Number(document.getElementById('qty-input').value)); ">Add to cart</button>
        <a href="checkout.html" class="btn btn-outline" onclick="addToCart(${p.id}, Number(document.getElementById('qty-input').value))">Buy now</a>
      </div>
      <ul class="pd-meta">
        <li>Free shipping on orders over $75</li>
        <li>30-day returns, prepaid label included</li>
        <li>Ships in 2–4 business days</li>
      </ul>
    </div>
  `;

  function stepQty(delta){
    const input = document.getElementById("qty-input");
    input.value = Math.max(1, Number(input.value) + delta);
  }

  document.getElementById("related-grid").innerHTML = PRODUCTS
    .filter(x => x.category === p.category && x.id !== p.id)
    .concat(PRODUCTS.filter(x => x.id !== p.id))
    .slice(0,4)
    .map(r => `
      <div class="product-card">
        <a href="product.html?id=${r.id}" class="product-media"><img src="${r.img}" alt="${r.name}"></a>
        <div class="product-body">
          <span class="product-cat">${r.category}</span>
          <h4><a href="product.html?id=${r.id}">${r.name}</a></h4>
          <div class="product-foot">
            <span class="ticket">${fmt(r.price)}</span>
            <button class="add-btn" onclick="addToCart(${r.id})">+</button>
          </div>
        </div>
      </div>`).join("");
</script>
</body>
</html>
