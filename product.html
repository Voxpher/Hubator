<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Hubator</title>
<link rel="stylesheet" href="/css/style.css?v=4">
<meta name="description" content="View product details, size guide and ordering information at Hubator.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.ico">
<!-- OG/Twitter filled dynamically -->
<meta id="og-title" property="og:title" content="Product — Hubator">
<meta id="og-desc" property="og:description" content="View product details at Hubator.">
<meta id="og-image" property="og:image" content="">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary_large_image">
<!-- JSON-LD product schema — filled dynamically -->
<script id="product-schema" type="application/ld+json">{}</script>

<style>
/* ════════════════════════════════════════════════════
   PRODUCT DETAIL PAGE — Premium PDP
   ════════════════════════════════════════════════════ */

.pdp-wrap {
  max-width: 1280px; margin: 0 auto; padding: 0 24px;
}

/* ── Breadcrumb ─────────────────────────────────── */
.pdp-breadcrumb {
  font-family: var(--font-mono); font-size: .72rem;
  color: var(--ink-soft); padding: 14px 0;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.pdp-breadcrumb a:hover { color: var(--gold-deep); }
.pdp-breadcrumb-sep { color: var(--line); }

/* ── Main grid ──────────────────────────────────── */
.pdp-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  padding: 8px 0 80px;
  align-items: start;
}

/* ════════════ GALLERY ════════════ */
.pdp-gallery {
  position: sticky; top: 80px;
}

/* Main image */
.pdp-main-img-wrap {
  position: relative;
  border-radius: 12px; overflow: hidden;
  background: var(--paper-dim);
  aspect-ratio: 1/1;
  cursor: zoom-in;
}
.pdp-main-img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .4s ease, opacity .2s ease;
  display: block;
}
.pdp-main-img.fading { opacity: 0; }
.pdp-main-img-wrap:hover .pdp-main-img { transform: scale(1.04); }
.pdp-main-img-wrap.zoomed { cursor: zoom-out; }
.pdp-main-img-wrap.zoomed .pdp-main-img { transform: scale(1.8); }

/* Gallery badge */
.pdp-gallery-badge {
  position: absolute; top: 14px; left: 14px; z-index: 2;
  font-family: var(--font-mono); font-size: .7rem; font-weight: 700;
  padding: 5px 10px; border-radius: 5px;
  background: var(--rust); color: var(--white);
  letter-spacing: .04em; text-transform: uppercase;
}

/* Thumbnail strip — desktop */
.pdp-thumbs {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
}
.pdp-thumb {
  width: 72px; height: 72px;
  border-radius: 8px; overflow: hidden;
  border: 2px solid transparent;
  cursor: pointer; flex-shrink: 0;
  transition: border-color .15s, opacity .15s;
  background: var(--paper-dim);
}
.pdp-thumb img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.pdp-thumb:hover { border-color: var(--ink-soft); }
.pdp-thumb.active { border-color: var(--gold); }

/* Mobile carousel */
.pdp-carousel {
  display: none;
  overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  gap: 0; border-radius: 12px; scroll-behavior: smooth;
}
.pdp-carousel::-webkit-scrollbar { display: none; }
.pdp-carousel-item {
  flex: 0 0 100%; scroll-snap-align: start;
  aspect-ratio: 1/1; overflow: hidden;
}
.pdp-carousel-item img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.pdp-dots {
  display: none; justify-content: center; gap: 6px; margin-top: 10px;
}
.pdp-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--line); border: none; padding: 0; cursor: pointer;
  transition: background .2s, transform .2s;
}
.pdp-dot.active { background: var(--ink); transform: scale(1.3); }

/* ════════════ INFO PANEL ════════════ */
.pdp-info {}

/* Category label */
.pdp-cat {
  font-family: var(--font-mono); font-size: .72rem;
  text-transform: uppercase; letter-spacing: .1em; color: var(--sage);
  display: block; margin-bottom: 8px;
}

/* Title */
.pdp-title {
  font-size: clamp(1.5rem, 3vw, 2.1rem); line-height: 1.15;
  font-weight: 700; margin: 0 0 20px; color: var(--ink);
}

/* Price block */
.pdp-price-block {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; margin-bottom: 24px;
}
.pdp-price {
  font-family: var(--font-mono); font-size: 1.5rem;
  font-weight: 700; color: var(--ink);
}
.pdp-price.on-sale { color: var(--rust); }
.pdp-compare {
  font-family: var(--font-mono); font-size: 1rem;
  color: var(--ink-soft); text-decoration: line-through;
}
.pdp-save-tag {
  font-family: var(--font-mono); font-size: .75rem; font-weight: 700;
  background: #FFF3F1; color: var(--rust);
  padding: 4px 9px; border-radius: 5px; letter-spacing: .02em;
}

/* Divider */
.pdp-divider {
  border: none; border-top: 1px solid var(--line); margin: 20px 0;
}
/* Short description — shown above fold near price */
.pdp-short-desc {
  font-size: .96rem; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.6;
}

/* ── Variant sections ────────────────────────────── */
.pdp-variant-section { margin-bottom: 20px; }
.pdp-variant-label {
  display: flex; align-items: baseline; gap: 6px;
  font-family: var(--font-mono); font-size: .74rem;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-soft); margin-bottom: 10px;
}
.pdp-variant-label strong {
  font-family: var(--font-body); font-size: .9rem;
  font-weight: 600; text-transform: none; letter-spacing: 0;
  color: var(--ink);
}

/* Color swatches */
.pdp-color-options { display: flex; flex-wrap: wrap; gap: 10px; }
.pdp-color-chip {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; flex-shrink: 0;
  position: relative; transition: transform .15s, box-shadow .15s;
}
.pdp-color-chip:hover { transform: scale(1.1); }
.pdp-color-chip[aria-pressed="true"] {
  border-color: var(--ink);
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
}
.pdp-color-chip[aria-pressed="true"]::after {
  content: "✓";
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem; font-weight: 700;
  color: var(--white);
  text-shadow: 0 0 3px rgba(0,0,0,.4);
}
.pdp-color-chip.is-unavailable {
  opacity: .32; cursor: not-allowed;
}
.pdp-color-chip.is-unavailable::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: linear-gradient(to top left, transparent calc(50% - 1px), var(--ink-soft) 50%, transparent calc(50% + 1px));
}
/* Named color (no hex) */
.pdp-color-chip.has-name {
  border-radius: 999px; width: auto; min-width: 36px; height: 36px;
  padding: 0 14px; font-family: var(--font-mono); font-size: .78rem;
  color: var(--ink); background: var(--white);
  border: 1.5px solid var(--line);
}
.pdp-color-chip.has-name[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.pdp-color-chip.has-name[aria-pressed="true"]::after { display: none; }

/* Size chips */
.pdp-size-options { display: flex; flex-wrap: wrap; gap: 8px; }
.pdp-size-chip {
  min-width: 52px; padding: 10px 16px;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--white); color: var(--ink);
  font-family: var(--font-mono); font-size: .84rem; font-weight: 600;
  cursor: pointer; text-align: center;
  transition: border-color .15s, background .15s, color .15s;
  position: relative;
}
.pdp-size-chip:hover { border-color: var(--ink); }
.pdp-size-chip[aria-pressed="true"] {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.pdp-size-chip.is-unavailable {
  color: var(--ink-soft); background: var(--paper-dim);
  border-style: dashed; cursor: not-allowed;
  text-decoration: line-through; opacity: .55;
}
.pdp-size-chip.is-unavailable:hover { border-color: var(--line); }

/* Helper microcopy */
.pdp-hint {
  font-size: .82rem; color: var(--ink-soft); margin: 8px 0 0;
  display: flex; align-items: center; gap: 5px;
}
.pdp-hint-warn { color: var(--rust); }

/* ── Quantity stepper ────────────────────────────── */
.pdp-qty-row {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.pdp-qty-label {
  font-family: var(--font-mono); font-size: .74rem;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-soft);
}
.pdp-qty-ctrl {
  display: flex; align-items: center;
  border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden;
}
.pdp-qty-btn {
  width: 40px; height: 40px; border: none; background: none;
  font-size: 1.2rem; cursor: pointer; color: var(--ink);
  transition: background .15s; display: flex; align-items: center; justify-content: center;
}
.pdp-qty-btn:hover { background: var(--paper-dim); }
.pdp-qty-val {
  width: 44px; text-align: center;
  font-family: var(--font-mono); font-size: .9rem; font-weight: 600;
  border: none; background: none; color: var(--ink); pointer-events: none;
}

/* ── CTA buttons ─────────────────────────────────── */
.pdp-actions {
  display: flex; flex-direction: column; gap: 10px;
}
.pdp-add-btn {
  width: 100%; padding: 15px 24px;
  background: var(--ink); color: var(--paper);
  border: none; border-radius: 8px;
  font-size: 1rem; font-weight: 700; font-family: var(--font-body);
  cursor: pointer; transition: background .2s, transform .15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.pdp-add-btn:hover:not(:disabled) { background: var(--gold-deep); transform: translateY(-1px); }
.pdp-add-btn:disabled { background: var(--paper-dim); color: var(--ink-soft); cursor: not-allowed; transform: none; }
.pdp-buy-btn {
  width: 100%; padding: 14px 24px;
  background: transparent; color: var(--ink);
  border: 2px solid var(--ink); border-radius: 8px;
  font-size: 1rem; font-weight: 700; font-family: var(--font-body);
  cursor: pointer; text-align: center; text-decoration: none;
  transition: background .2s, color .2s, transform .15s;
  display: flex; align-items: center; justify-content: center;
}
.pdp-buy-btn:hover:not(.disabled) { background: var(--ink); color: var(--paper); transform: translateY(-1px); }
.pdp-buy-btn.disabled { opacity: .45; cursor: not-allowed; transform: none; pointer-events: none; }

/* ── Trust badges ────────────────────────────────── */
.pdp-trust {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 20px; padding-top: 20px;
  border-top: 1px solid var(--line);
}
.pdp-trust-item {
  display: flex; align-items: center; gap: 10px;
  font-size: .84rem; color: var(--ink-soft);
}
.pdp-trust-icon {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--paper-dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}

/* ── Product details accordion ───────────────────── */
.pdp-accordion { margin-top: 8px; }
.pdp-accordion-item {
  border-top: 1px solid var(--line);
}
.pdp-accordion-item:last-child { border-bottom: 1px solid var(--line); }
.pdp-accordion-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; cursor: pointer; background: none; border: none;
  width: 100%; text-align: left;
  font-family: var(--font-mono); font-size: .8rem;
  text-transform: uppercase; letter-spacing: .08em; color: var(--ink);
  font-weight: 600;
}
.pdp-accordion-icon {
  font-size: .9rem; color: var(--ink-soft);
  transition: transform .2s;
}
.pdp-accordion-item.open .pdp-accordion-icon { transform: rotate(45deg); }
.pdp-accordion-body {
  display: none; padding: 0 0 16px;
  font-size: .9rem; color: var(--ink-soft); line-height: 1.7;
}
.pdp-accordion-item.open .pdp-accordion-body { display: block; }

/* ── Mini cart toast ─────────────────────────────── */
.pdp-toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(24px);
  background: var(--ink); color: var(--paper);
  padding: 12px 24px; border-radius: 8px;
  font-size: .88rem; font-weight: 500;
  opacity: 0; transition: opacity .25s ease, transform .25s ease;
  z-index: 500; pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(22,35,31,.22);
  display: flex; align-items: center; gap: 8px;
}
.pdp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Sticky mobile CTA bar ───────────────────────── */
.pdp-sticky-bar {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 12px 20px; gap: 10px;
}
.pdp-sticky-bar-title {
  font-size: .84rem; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 55%;
}
.pdp-sticky-bar-price {
  font-family: var(--font-mono); font-size: .88rem;
  font-weight: 700; color: var(--ink); white-space: nowrap;
}
.pdp-sticky-add {
  flex: 1; padding: 11px 14px;
  background: var(--ink); color: var(--paper);
  border: none; border-radius: 6px;
  font-size: .88rem; font-weight: 700; cursor: pointer;
  font-family: var(--font-body); white-space: nowrap;
}
.pdp-sticky-add:disabled { background: var(--paper-dim); color: var(--ink-soft); cursor: not-allowed; }

/* ── Loading skeleton ────────────────────────────── */
.pdp-skeleton { padding: 24px 0 80px; }
.pdp-skeleton-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
.skel { border-radius: 8px; animation: shimmer 1.4s infinite; background: var(--paper-dim);
  background-size: 200% 100%;
  background-image: linear-gradient(90deg,var(--paper-dim) 25%,var(--line) 50%,var(--paper-dim) 75%);
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Responsive ──────────────────────────────────── */
@media(max-width:1023px){
  .pdp-grid { grid-template-columns: 1fr; gap: 32px; }
  .pdp-gallery { position: static; }
  .pdp-thumbs { display: none; }
  .pdp-carousel { display: flex; }
  .pdp-dots { display: flex; }
  .pdp-main-img-wrap { display: none; }
  .pdp-sticky-bar { display: flex; align-items: center; }
  main { padding-bottom: 76px; }
}
@media(max-width:600px){
  .pdp-wrap { padding: 0 16px; }
  .pdp-title { font-size: 1.5rem; }
  .pdp-grid { gap: 24px; }
}
</style>
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="pdp-wrap">
    <!-- Breadcrumb -->
    <nav class="pdp-breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a>
      <span class="pdp-breadcrumb-sep" aria-hidden="true">/</span>
      <a href="/shop">Shop</a>
      <span class="pdp-breadcrumb-sep" aria-hidden="true">/</span>
      <span id="crumb-name" aria-current="page">Product</span>
    </nav>

    <!-- Loading skeleton -->
    <div class="pdp-skeleton" id="pdp-skeleton">
      <div class="pdp-skeleton-grid">
        <div class="skel" style="aspect-ratio:1/1;border-radius:12px;"></div>
        <div style="display:flex;flex-direction:column;gap:16px;padding-top:8px;">
          <div class="skel" style="height:14px;width:30%;"></div>
          <div class="skel" style="height:36px;width:85%;"></div>
          <div class="skel" style="height:28px;width:40%;"></div>
          <div class="skel" style="height:1px;width:100%;"></div>
          <div class="skel" style="height:14px;width:20%;"></div>
          <div style="display:flex;gap:10px;">
            <div class="skel" style="width:36px;height:36px;border-radius:50%;"></div>
            <div class="skel" style="width:36px;height:36px;border-radius:50%;"></div>
            <div class="skel" style="width:36px;height:36px;border-radius:50%;"></div>
          </div>
          <div class="skel" style="height:14px;width:20%;margin-top:4px;"></div>
          <div style="display:flex;gap:8px;">
            <div class="skel" style="width:52px;height:42px;border-radius:8px;"></div>
            <div class="skel" style="width:52px;height:42px;border-radius:8px;"></div>
            <div class="skel" style="width:52px;height:42px;border-radius:8px;"></div>
          </div>
          <div class="skel" style="height:50px;width:100%;border-radius:8px;margin-top:8px;"></div>
          <div class="skel" style="height:48px;width:100%;border-radius:8px;"></div>
        </div>
      </div>
    </div>

    <!-- Product content — rendered by JS -->
    <div id="pdp-root" style="display:none;" aria-live="polite"></div>
  </div>
</main>

<!-- Sticky mobile add-to-cart bar -->
<div class="pdp-sticky-bar" id="pdp-sticky-bar">
  <div>
    <div class="pdp-sticky-bar-title" id="sticky-title"></div>
    <div class="pdp-sticky-bar-price" id="sticky-price"></div>
  </div>
  <button class="pdp-sticky-add" id="sticky-add" disabled>Add to cart</button>
</div>

<!-- Toast -->
<div class="pdp-toast" id="pdp-toast" aria-live="polite">
  <span>✓</span><span id="toast-msg">Added to cart</span>
</div>

<!-- ── Full Description Section (rendered if product has fullDescription) ── -->
<section id="full-desc-section" style="max-width:1280px;margin:0 auto;padding:0 24px 0;display:none;">
  <style>
  .full-desc-wrap { border:1px solid var(--line); border-radius:10px; background:var(--white); padding:28px 32px; margin-bottom:0; }
  .full-desc-wrap h2 { font-family:var(--font-display); font-size:1.3rem; margin:0 0 18px; }
  .full-desc-body { font-size:.95rem; line-height:1.75; color:var(--ink-soft); }
  .full-desc-body p { margin:0 0 1em; }
  .full-desc-body ul, .full-desc-body ol { margin:0 0 1em; padding-left:1.5em; }
  .full-desc-body strong { color:var(--ink); }
  </style>
  <div class="full-desc-wrap">
    <h2>Product Details</h2>
    <div class="full-desc-body" id="full-desc-body"></div>
  </div>
</section>

<!-- ── Reviews Section ───────────────────────────────────────────── -->
<section id="reviews-section" style="max-width:1280px;margin:48px auto 0;padding:0 24px 72px;">
  <style>
  /* ── Reviews ──────────────────────────────────── */
  .rv-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:28px; }
  .rv-header h2 { font-family:var(--font-display); font-size:clamp(1.3rem,2.5vw,1.8rem); margin:0; }
  .rv-summary { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .rv-avg { font-family:var(--font-mono); font-size:2rem; font-weight:700; color:var(--ink); line-height:1; }
  .rv-stars-row { display:flex; gap:3px; }
  .rv-star { width:18px; height:18px; fill:var(--gold); }
  .rv-star.empty { fill:none; stroke:var(--line); stroke-width:1.5; }
  .rv-count { font-family:var(--font-mono); font-size:.8rem; color:var(--ink-soft); }
  .rv-bars { display:flex; flex-direction:column; gap:4px; }
  .rv-bar-row { display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft); }
  .rv-bar-track { flex:1; height:6px; background:var(--line); border-radius:3px; min-width:80px; }
  .rv-bar-fill { height:6px; background:var(--gold); border-radius:3px; transition:width .4s; }
  .rv-write-btn { padding:10px 20px; background:var(--ink); color:var(--paper); border:none; border-radius:6px; font-weight:600; font-family:var(--font-body); font-size:.9rem; cursor:pointer; transition:background .2s; }
  .rv-write-btn:hover { background:var(--gold-deep); }
  /* Form */
  .rv-form-wrap { border:1px solid var(--line); border-radius:10px; background:var(--white); padding:24px; margin-bottom:32px; display:none; }
  .rv-form-wrap.open { display:block; }
  .rv-form-wrap h3 { font-size:1rem; margin:0 0 18px; }
  .rv-star-picker { display:flex; gap:6px; margin-bottom:16px; }
  .rv-star-pick { width:32px; height:32px; cursor:pointer; fill:var(--line); transition:fill .15s; }
  .rv-star-pick.lit { fill:var(--gold); }
  .rv-field { margin-bottom:14px; }
  .rv-field label { display:block; font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:5px; }
  .rv-field input, .rv-field textarea { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:6px; font-family:var(--font-body); font-size:.9rem; background:var(--paper); resize:vertical; }
  .rv-field input:focus, .rv-field textarea:focus { border-color:var(--sage); outline:none; }
  .rv-photo-upload { border:2px dashed var(--line); border-radius:6px; padding:16px; text-align:center; cursor:pointer; font-size:.84rem; color:var(--ink-soft); transition:border-color .15s; }
  .rv-photo-upload:hover { border-color:var(--ink); }
  .rv-photo-thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }

<script>
/* ── Reviews JS ──────────────────────────────────────────────── */
(function(){
function apiBase(){ return (window.HUBATOR_API_BASE||'').replace(/\/$/,''); }
var reviewSlug = '';
var rvPage = 1;
var rvTotal = 0;
var rvLimit = 6;
var rvRating = 0;
var rvPhotos = []; // local File objects
var rvPhotoUrls = []; // uploaded Cloudinary URLs

function starSVG(filled) {
  var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('width','18'); s.setAttribute('height','18');
  s.setAttribute('class','rv-star'+(filled?'':' empty'));
  var p = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  p.setAttribute('points','12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26');
  if(!filled){ s.setAttribute('fill','none'); s.setAttribute('stroke','#D8D2C4'); s.setAttribute('stroke-width','1.5'); }
  else { s.setAttribute('fill','#C99A2E'); }
  s.appendChild(p); return s;
}

function starsHTML(rating) {
  var wrap = document.createElement('div'); wrap.className='rv-stars-row';
  for(var i=1;i<=5;i++) wrap.appendChild(starSVG(i<=Math.round(rating)));
  return wrap;
}

function escText(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtDate(iso) {
  var d=new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

function loadReviews(append) {
  if(!reviewSlug) return;
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, 10000); // 10s timeout
  var list = document.getElementById('rv-list');
  var empty = document.getElementById('rv-empty');
  if(!append && list) list.innerHTML = '<div style="padding:20px 0;color:var(--ink-soft);font-size:.88rem;">Loading reviews…</div>';
  fetch(apiBase()+'/api/public/reviews?product='+encodeURIComponent(reviewSlug)+'&page='+rvPage+'&limit='+rvLimit, { signal: ctrl.signal })
    .then(function(r){ clearTimeout(timer); return r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)); })
    .then(function(data){
      if(!data) return;
      rvTotal = data.total || 0;

      // Summary
      if(data.avgRating && rvTotal > 0){
        var sumEl = document.getElementById('rv-summary');
        sumEl.style.display='flex';
        document.getElementById('rv-avg').textContent = data.avgRating.toFixed(1);
        var avgStars = document.getElementById('rv-avg-stars');
        avgStars.innerHTML=''; avgStars.appendChild(starsHTML(data.avgRating));
        document.getElementById('rv-count').textContent = rvTotal+' review'+(rvTotal===1?'':'s');
        // Rating bars
        var bars = document.getElementById('rv-bars');
        bars.innerHTML='';
        [5,4,3,2,1].forEach(function(n){
          var cnt = (data.ratingDistribution||{})[n]||0;
          var pct = rvTotal>0 ? Math.round(cnt/rvTotal*100) : 0;
          var row = document.createElement('div'); row.className='rv-bar-row';
          row.innerHTML='<span>'+n+'★</span><div class="rv-bar-track"><div class="rv-bar-fill" style="width:'+pct+'%"></div></div><span>'+cnt+'</span>';
          bars.appendChild(row);
        });
      }

      var list = document.getElementById('rv-list');
      var empty = document.getElementById('rv-empty');
      var reviews = data.reviews||[];

      if(!append) list.innerHTML='';
      if(reviews.length===0 && !append){ empty.style.display='block'; }
      else { empty.style.display='none'; }

      reviews.forEach(function(rv){
        var card = document.createElement('div'); card.className='rv-card';
        var photosHTML='';
        if(Array.isArray(rv.photos)&&rv.photos.length){
          photosHTML='<div class="rv-card-photos">'+rv.photos.map(function(u){
            return '<img class="rv-card-photo" src="'+escText(u)+'" alt="Review photo" loading="lazy" onclick="openLightbox(\''+escText(u)+'\')"/>';
          }).join('')+'</div>';
        }
        var adminReplyHTML='';
        if(rv.adminReply){
          adminReplyHTML='<div class="rv-admin-reply"><strong>Store response</strong>'+escText(rv.adminReply)+'</div>';
        }
        var starsEl=document.createElement('div'); starsEl.appendChild(starsHTML(rv.rating));
        card.innerHTML=
          '<div class="rv-card-top">'+starsEl.innerHTML+
            '<span class="rv-card-name">'+escText(rv.reviewerName)+'</span>'+
            (rv.verifiedPurchase?'<span class="rv-verified">✓ Verified purchase</span>':'')+
            '<span class="rv-card-date">'+fmtDate(rv.createdAt)+'</span>'+
          '</div>'+
          (rv.title?'<div style="font-weight:700;font-size:.88rem;margin-bottom:6px;">'+escText(rv.title)+'</div>':'')+
          '<div class="rv-card-body">'+escText(rv.body)+'</div>'+
          photosHTML+adminReplyHTML;
        list.appendChild(card);
      });

      var loadMore = document.getElementById('rv-load-more');
      var loaded = (rvPage-1)*rvLimit+reviews.length;
      loadMore.style.display = loaded < rvTotal ? 'block' : 'none';
    }).catch(function(err){
      clearTimeout(timer);
      var list = document.getElementById('rv-list');
      var isAbort = err && err.name === 'AbortError';
      if(list && !append) {
        list.innerHTML = '<div style="padding:20px 0;color:var(--ink-soft);font-size:.88rem;">' +
          (isAbort ? 'Reviews are taking longer than usual.' : 'Couldn\'t load reviews right now.') +
          ' <button onclick="retryReviews();" style="background:none;border:none;color:var(--gold-deep);cursor:pointer;font-size:.88rem;text-decoration:underline;padding:0;">Try again</button>' +
          '</div>';
      }
    });
}

window.loadMoreReviews = function(){
  rvPage++;
  loadReviews(true);
};
window.retryReviews = function(){ rvPage=1; loadReviews(false); };

window.toggleReviewForm = function(){
  var f=document.getElementById('rv-form-wrap');
  f.classList.toggle('open');
  if(f.classList.contains('open')) document.getElementById('rv-name').focus();
};

// Star picker
(function(){
  var stars = document.querySelectorAll('.rv-star-pick');
  stars.forEach(function(s){
    s.addEventListener('click',function(){
      rvRating=parseInt(s.getAttribute('data-val'));
      stars.forEach(function(x){ x.classList.toggle('lit',parseInt(x.getAttribute('data-val'))<=rvRating); });
    });
    s.addEventListener('mouseover',function(){
      var v=parseInt(s.getAttribute('data-val'));
      stars.forEach(function(x){ x.style.fill=parseInt(x.getAttribute('data-val'))<=v?'#C99A2E':'#D8D2C4'; });
    });
    s.addEventListener('mouseout',function(){
      stars.forEach(function(x){ x.style.fill=parseInt(x.getAttribute('data-val'))<=rvRating?'#C99A2E':'#D8D2C4'; });
    });
  });
})();

// Photo select
window.handlePhotoSelect = function(input){
  var files = Array.from(input.files||[]).slice(0,5);
  rvPhotos = files;
  var thumbs = document.getElementById('rv-photo-thumbs');
  thumbs.innerHTML='';
  files.forEach(function(f){
    var url=URL.createObjectURL(f);
    var img=document.createElement('img'); img.className='rv-photo-thumb'; img.src=url;
    thumbs.appendChild(img);
  });
};

// Submit review
window.submitReview = function(){
  var name = (document.getElementById('rv-name').value||'').trim();
  var email = (document.getElementById('rv-email').value||'').trim();
  var body = (document.getElementById('rv-body').value||'').trim();
  var msgEl = document.getElementById('rv-form-msg');
  var btn = document.getElementById('rv-submit-btn');

  function showMsg(msg,isErr){
    msgEl.textContent=msg; msgEl.style.display='block';
    msgEl.className='rv-form-msg'+(isErr?' rv-form-err':'');
  }

  if(!rvRating){ showMsg('Please select a rating.',true); return; }
  if(!name){ showMsg('Please enter your name.',true); return; }
  if(!body){ showMsg('Please write your review.',true); return; }

  btn.disabled=true; btn.textContent='Submitting…';

  // Upload photos first if any
  var uploadPromise = Promise.resolve([]);
  if(rvPhotos.length > 0){
    var fd = new FormData();
    rvPhotos.forEach(function(f){ fd.append('photos',f); });
    uploadPromise = fetch(apiBase()+'/api/public/reviews/upload',{ method:'POST', body:fd })
      .then(function(r){ return r.json(); })
      .then(function(d){ return d.urls||[]; })
      .catch(function(){ return []; });
  }

  uploadPromise.then(function(photoUrls){
    return fetch(apiBase()+'/api/public/reviews',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ productSlug:reviewSlug, rating:rvRating, reviewerName:name, reviewerEmail:email, body:body, photos:photoUrls })
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:d}; }); });
  }).then(function(res){
    btn.disabled=false; btn.textContent='Submit review';
    if(!res.ok){ showMsg(res.data.error||'Could not submit review.',true); return; }
    showMsg('Thank you! Your review has been submitted and is pending approval.', false);
    document.getElementById('rv-name').value='';
    document.getElementById('rv-email').value='';
    document.getElementById('rv-body').value='';
    document.getElementById('rv-photo-thumbs').innerHTML='';
    document.getElementById('rv-photo-input').value='';
    rvRating=0; rvPhotos=[]; rvPhotoUrls=[];
    document.querySelectorAll('.rv-star-pick').forEach(function(s){ s.classList.remove('lit'); s.style.fill='#D8D2C4'; });
    setTimeout(function(){ document.getElementById('rv-form-wrap').classList.remove('open'); msgEl.style.display='none'; },3000);
  }).catch(function(){
    btn.disabled=false; btn.textContent='Submit review';
    showMsg('Something went wrong. Please try again.',true);
  });
};

// Lightbox
window.openLightbox = function(url){
  var lb=document.getElementById('rv-lightbox');
  document.getElementById('rv-lightbox-img').src=url;
  lb.classList.add('open');
};
window.closeLightbox = function(){
  document.getElementById('rv-lightbox').classList.remove('open');
};
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeLightbox(); });

// Boot — wait for product slug to be set
function initReviews(){
  var sp = new URLSearchParams(location.search);
  reviewSlug = sp.get('slug') || '';
  if(!reviewSlug){
    // Try path-based slug
    var m = location.pathname.match(/\/product\/([^/]+)/);
    if(m) reviewSlug = decodeURIComponent(m[1]);
  }
  if(reviewSlug) loadReviews(false);
}

// Wait for config.js to set HUBATOR_API_BASE — poll up to 3s then init
(function waitForApi(){
  if(window.HUBATOR_API_BASE) { initReviews(); return; }
  var attempts = 0;
  var t = setInterval(function(){
    if(window.HUBATOR_API_BASE || ++attempts > 30){ clearInterval(t); initReviews(); }
  }, 100);
})();
})();
</script>

<script>
(function(){
'use strict';

/* ── Fallback hex map ───────────────────────────── */
var HEX_FB = {
  "white":"#FFFFFF","off white":"#FAF9F6","cream":"#F5EFD9","beige":"#E8DCC8",
  "tan":"#D2B48C","brown":"#7C4A2D","black":"#1A1A1A","charcoal":"#3C4043",
  "grey":"#9AA0A6","gray":"#9AA0A6","navy":"#1F3A5F","blue":"#2563EB",
  "sky blue":"#7DD3FC","teal":"#14B8A6","green":"#2F7D4F","olive":"#6B7A3A",
  "yellow":"#FACC15","mustard":"#D4A017","orange":"#F97316","rust":"#B7410E",
  "red":"#DC2626","maroon":"#7C2D3B","pink":"#F9A8D4","peach":"#FDBA99",
  "purple":"#7C3AED","lavender":"#B57EDC"
};
function hexOf(name, hex) {
  if(hex && /^#[a-fA-F0-9]{6}$/.test(hex)) return hex;
  return HEX_FB[String(name||'').trim().toLowerCase()] || '';
}

/* ── Toast ──────────────────────────────────────── */
var toastEl = document.getElementById('pdp-toast');
var toastMsg = document.getElementById('toast-msg');
var toastTimer;
function showToast(msg) {
  toastMsg.textContent = msg || 'Added to cart';
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
}

/* ── Quantity stepper state ─────────────────────── */
var qty = 1;

/* ── DOM refs ───────────────────────────────────── */
var skeleton  = document.getElementById('pdp-skeleton');
var pdpRoot   = document.getElementById('pdp-root');
var crumbEl   = document.getElementById('crumb-name');
var stickyBar = document.getElementById('pdp-sticky-bar');
var stickyTitle = document.getElementById('sticky-title');
var stickyPrice = document.getElementById('sticky-price');
var stickyAdd   = document.getElementById('sticky-add');

/* ── Fetch trust badge texts from dashboard settings ── */
(function(){
  var apiBase = (window.HUBATOR_API_BASE||'').replace(/\/$/,'');
  if(!apiBase) return;
  fetch(apiBase+'/api/public/settings')
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      if(!d||!d.trustBadges) return;
      var tb = d.trustBadges;
      var els = {
        'trust-secure': tb.secureCheckout,
        'trust-shipping': tb.shipping,
        'trust-returns': tb.returns,
        'trust-currency': tb.currency
      };
      Object.keys(els).forEach(function(id){
        var el = document.getElementById(id);
        if(el && els[id]) el.textContent = els[id];
      });
    }).catch(function(){});
})();

/* ── Main render ────────────────────────────────── */
loadProducts().then(function(){
  var ref = productReferenceFromLocation(window.location);
  var p = ref.value ? getProductFromReference(ref) : null;

  skeleton.style.display = 'none';
  pdpRoot.style.display = '';

  if(!p) {
    pdpRoot.innerHTML = '<div style="text-align:center;padding:80px 20px;"><p style="font-size:1.1rem;color:var(--ink-soft);">That product is no longer available.</p><a href="/shop" class="btn btn-outline" style="margin-top:16px;display:inline-flex;">Browse shop</a></div>';
    return;
  }

  // Redirect to canonical slug URL
  if(ref.type !== 'slug' || ref.value !== p.slug) {
    history.replaceState(null, '', productUrl(p));
  }

  // Update meta
  document.title = p.name + ' — Hubator';
  crumbEl.textContent = p.name;
  var ogTitle = document.getElementById('og-title');
  var ogDesc  = document.getElementById('og-desc');
  var ogImg   = document.getElementById('og-image');
  if(ogTitle) ogTitle.content = p.name + ' — Hubator';
  if(ogDesc)  ogDesc.content  = p.desc || ('Shop ' + p.name + ' at Hubator.');
  if(ogImg && p.img)  ogImg.content  = p.img;

  // Dynamic JSON-LD
  var schemaEl = document.getElementById('product-schema');
  if(schemaEl) {
    var offers = [];
    if(p.variants && typeof p.variants.forEach === 'function'){
      p.variants.forEach(function(v){
        offers.push({
          '@type': 'Offer',
          price: String(v.priceOverride != null ? v.priceOverride : p.price),
          priceCurrency: 'INR',
          availability: (v.stock == null || v.stock > 0) ? 'InStock' : 'OutOfStock',
          name: [v.color,v.size].filter(Boolean).join(' / ')
        });
      });
    }
    if(!offers.length) offers.push({'@type':'Offer',price:String(p.price),priceCurrency:'INR',availability:(p.stock==null||p.stock>0)?'InStock':'OutOfStock'});
    schemaEl.textContent = JSON.stringify({
      '@context':'https://schema.org',
      '@type':'Product',
      name: p.name,
      description: p.desc || '',
      image: p.gallery && p.gallery.length ? p.gallery : (p.img ? [p.img] : []),
      brand: {'@type':'Brand',name:'Hubator'},
      offers: offers
    });
  }

  buildPage(p);

  // Show Product Details section — uses fullDescription if set, falls back to description
  var fullDescText = p.fullDescription || p.description || '';
  if(fullDescText && fullDescText.trim()) {
    var fdSection = document.getElementById('full-desc-section');
    var fdBody = document.getElementById('full-desc-body');
    if(fdSection && fdBody) {
      // Content comes from the admin dashboard (trusted source) — safe to render as HTML
      fdBody.innerHTML = fullDescText;
      fdSection.style.display = 'block';
      fdSection.style.marginTop = '32px';
      fdSection.style.marginBottom = '48px';
    }
  }

}).catch(function(err){
  console.error('[Hubator] pdp:', err);
  skeleton.style.display = 'none';
  pdpRoot.style.display = '';
  pdpRoot.innerHTML = '<div style="text-align:center;padding:80px 20px;"><p style="color:var(--rust);">We couldn\'t load this product. Please refresh.</p></div>';
});

/* ════════════════════════════════════════════════
   BUILD PAGE
   ════════════════════════════════════════════════ */
function buildPage(p) {
  /* --- Parse variants --- */
  var variants = [];
  if(p.variants && typeof p.variants.forEach === 'function'){
    p.variants.forEach(function(v){ if(v) variants.push(v); });
  }
  var colors = [];
  variants.forEach(function(v){
    if(v.color && !colors.some(function(c){ return c.name===v.color; })){
      colors.push({ name:v.color, hex: hexOf(v.color, v.colorHex) });
    }
  });
  var hasSizes = variants.some(function(v){ return !!v.size; });
  var colorImages = Array.isArray(p.colorImages) ? p.colorImages : [];

  /* --- Helpers --- */
  function stockFor(v) { return v && v.stock != null ? v.stock : (p.stock != null ? p.stock : 999); }
  function variantsForColor(name) { return variants.filter(function(v){ return !name || v.color===name; }); }
  function imagesForColor(name) {
    var wanted = String(name||'').trim().toLowerCase();
    return colorImages.filter(function(ci){ return ci&&typeof ci.url==='string'&&String(ci.color||'').trim().toLowerCase()===wanted; }).map(function(ci){ return safeProductImageUrl(ci.url); }).filter(Boolean);
  }
  function savings(price, old) { return old&&old>price ? Math.round((1-price/old)*100) : 0; }
  function priceFor(v) { return v&&v.priceOverride!=null ? Number(v.priceOverride) : p.price; }
  function variantIdOf(v) { return v ? String(v._id||v.id||'') : ''; }

  /* --- Build gallery --- */
  var allImages = [];
  if(p.img) allImages.push(safeProductImageUrl(p.img));
  (p.gallery||[]).forEach(function(u){ var s=safeProductImageUrl(u); if(s&&s!==allImages[0]) allImages.push(s); });

  function galleryHTML(imgs) {
    if(!imgs || !imgs.length) imgs = ['/favicon.ico'];
    // Desktop: main + thumbs
    var desktop = '<div class="pdp-main-img-wrap" id="pdp-main-wrap">' +
      (savings(p.price, p.oldPrice) > 0 ? '<span class="pdp-gallery-badge">Sale</span>' : '') +
      '<img class="pdp-main-img" id="pdp-main-img" src="'+escapeHtml(imgs[0])+'" alt="'+escapeHtml(p.name)+'">' +
      '</div>';
    if(imgs.length > 1){
      desktop += '<div class="pdp-thumbs" id="pdp-thumbs">' +
        imgs.map(function(u,i){
          return '<div class="pdp-thumb'+(i===0?' active':'')+'" data-idx="'+i+'" data-url="'+escapeHtml(u)+'"><img src="'+escapeHtml(u)+'" alt="'+escapeHtml(p.name)+' image '+(i+1)+'" loading="lazy"></div>';
        }).join('') +
      '</div>';
    }
    // Mobile: carousel + dots
    var mobile = '<div class="pdp-carousel" id="pdp-carousel">' +
      imgs.map(function(u){ return '<div class="pdp-carousel-item"><img src="'+escapeHtml(u)+'" alt="" loading="lazy"></div>'; }).join('') +
      '</div>';
    if(imgs.length > 1){
      mobile += '<div class="pdp-dots" id="pdp-dots">' +
        imgs.map(function(_,i){ return '<button class="pdp-dot'+(i===0?' active':'')+'" data-idx="'+i+'" aria-label="Image '+(i+1)+'"></button>'; }).join('') +
      '</div>';
    }
    return desktop + mobile;
  }

  /* --- Build price block --- */
  function priceBlockHTML(price, old) {
    var s = savings(price, old);
    return '<div class="pdp-price-block" id="pdp-price-block">' +
      (old ? '<span class="pdp-compare">'+fmt(old)+'</span><span class="pdp-price on-sale" id="pdp-price">'+fmt(price)+'</span>' : '<span class="pdp-price" id="pdp-price">'+fmt(price)+'</span>') +
      (s > 0 ? '<span class="pdp-save-tag">'+s+'% off</span>' : '') +
    '</div>';
  }

  /* --- Description/accordion --- */
  // fullDescription is the field the dashboard writes; legacy `description`
  // is only a fallback for products saved before the split.
  var desc = p.fullDescription || p.desc || '';
  var accordionItems = [];
  // Only add sections if their show toggle is true (default true for existing products)
  if(p.showDescription !== false) {
    accordionItems.push({ title: 'Product Description', body: desc || 'No description available.' });
  }
  if(p.showShippingReturns !== false) {
    var shippingBody = p.shippingReturns || 'Free shipping on orders above \u20b9999. Easy 7-day returns on all products.';
    accordionItems.push({ title: 'Shipping & Returns', body: shippingBody });
  }
  if(p.showCareInstructions !== false) {
    var careBody = p.careInstructions || 'Machine wash cold. Do not bleach. Tumble dry low. Iron on low heat.';
    accordionItems.push({ title: 'Care Instructions', body: careBody });
  }

  /* --- Render full page --- */
  pdpRoot.innerHTML =
    '<div class="pdp-grid">' +
    '<div class="pdp-gallery" id="pdp-gallery">' + galleryHTML(allImages) + '</div>' +
    '<div class="pdp-info">' +
      '<span class="pdp-cat">'+escapeHtml(p.category)+'</span>' +
      '<h1 class="pdp-title">'+escapeHtml(p.name)+'</h1>' +
      (p.shortDescription ? '<p class="pdp-short-desc">'+escapeHtml(p.shortDescription)+'</p>' : '') +
      priceBlockHTML(p.price, p.oldPrice) +
      '<hr class="pdp-divider">' +
      '<div id="pdp-variants"></div>' +
      '<hr class="pdp-divider">' +
      '<div class="pdp-qty-row">' +
        '<span class="pdp-qty-label">Qty</span>' +
        '<div class="pdp-qty-ctrl">' +
          '<button class="pdp-qty-btn" id="qty-minus" aria-label="Decrease quantity">−</button>' +
          '<input class="pdp-qty-val" id="qty-val" type="number" min="1" max="99" value="1" readonly>' +
          '<button class="pdp-qty-btn" id="qty-plus" aria-label="Increase quantity">+</button>' +
        '</div>' +
      '</div>' +
      '<div class="pdp-actions">' +
        '<button class="pdp-add-btn" id="pdp-add" disabled>Add to cart</button>' +
        '<a href="#" class="pdp-buy-btn disabled" id="pdp-buy">Buy now</a>' +
      '</div>' +
      '<div class="pdp-trust" id="pdp-trust">' +
        '<div class="pdp-trust-item"><span class="pdp-trust-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></svg></span><span id="trust-secure">Secure checkout — Razorpay encrypted</span></div>' +
        '<div class="pdp-trust-item"><span class="pdp-trust-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4h13v13H1Z"/><path d="M14 9h4l4 4v4h-8"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></span><span id="trust-shipping">Shipping calculated at checkout</span></div>' +
        '<div class="pdp-trust-item"><span class="pdp-trust-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 6 6 6"/><path d="M3 10h11a6 6 0 0 1 0 12h-3"/></svg></span><span id="trust-returns">Easy 7-day returns</span></div>' +
        '<div class="pdp-trust-item"><span class="pdp-trust-icon" style="font-family:var(--font-mono);font-size:.8rem;font-weight:700;">₹</span><span id="trust-currency">Prices shown in Indian Rupees</span></div>' +
      '</div>' +
    '</div>' +
    '</div>';

  /* ── State ──────────────────────────────────── */
  var selColor = colors.length === 1 ? colors[0].name : '';
  var selSize  = '';

  /* ── Sync URL params on load ─────────────────── */
  (function(){
    var sp = new URLSearchParams(location.search);
    var pc = (sp.get('color')||'').trim().toLowerCase();
    var ps = (sp.get('size')||'').trim();
    if(pc) { var match = colors.find(function(c){ return c.name.toLowerCase()===pc; }); if(match) selColor=match.name; }
    if(ps) selSize = ps;
  })();

  /* ── Variant render ─────────────────────────── */
  function renderVariants() {
    var host = document.getElementById('pdp-variants');
    if(!host) return;
    var out = '';

    // Colors
    if(colors.length > 1){
      out += '<div class="pdp-variant-section"><div class="pdp-variant-label">Color' +
        (selColor ? '&nbsp;<strong>'+escapeHtml(selColor)+'</strong>' : '') +
      '</div><div class="pdp-color-options">';
      colors.forEach(function(c){
        var anyStock = variants.some(function(v){ return v.color===c.name&&stockFor(v)>0; });
        var bg = c.hex;
        var isNamed = !bg;
        out += '<button type="button" class="pdp-color-chip'+(selColor===c.name?' ':'')+(anyStock?'':' is-unavailable')+(isNamed?' has-name':'') +'"' +
          (bg ? ' style="background:'+escapeHtml(bg)+';"' : '') +
          ' data-color="'+escapeHtml(c.name)+'"' +
          ' title="'+escapeHtml(c.name)+(anyStock?'':' — out of stock')+'"' +
          ' aria-pressed="'+(selColor===c.name?'true':'false')+'"' +
          ' aria-label="'+escapeHtml(c.name)+'">' +
          (isNamed ? escapeHtml(c.name) : '') +
        '</button>';
      });
      out += '</div>';
      if(!selColor) out += '<p class="pdp-hint">Choose a colour to see available sizes</p>';
      out += '</div>';
    }

    // Sizes
    if(hasSizes){
      var sizesForColor = [];
      variantsForColor(selColor||'').forEach(function(v){ if(v.size&&sizesForColor.indexOf(v.size)===-1) sizesForColor.push(v.size); });
      out += '<div class="pdp-variant-section"><div class="pdp-variant-label">Size' +
        (selSize ? '&nbsp;<strong>'+escapeHtml(selSize)+'</strong>' : '') +
      '</div><div class="pdp-size-options">';
      sizesForColor.forEach(function(s){
        var sv = variantsForColor(selColor).find(function(v){ return v.size===s; });
        var inStock = sv && stockFor(sv) > 0;
        out += '<button type="button" class="pdp-size-chip'+(selSize===s?' ':'')+(inStock?'':' is-unavailable')+'"' +
          ' data-size="'+escapeHtml(s)+'"' +
          ' aria-pressed="'+(selSize===s?'true':'false')+'"' +
          (inStock?'':' title="Out of stock"') + '>'+escapeHtml(s)+'</button>';
      });
      out += '</div>';
      if(selColor || colors.length===0){
        if(!selSize) out += '<p class="pdp-hint">Choose a size</p>';
      }
      out += '</div>';
    }

    host.innerHTML = out;

    // Re-bind events
    host.querySelectorAll('[data-color]').forEach(function(btn){
      btn.addEventListener('click', function(){
        selColor = btn.getAttribute('data-color');
        selSize  = '';
        // Swap gallery images
        var colorPhotos = imagesForColor(selColor);
        if(colorPhotos.length > 0) swapGallery(colorPhotos);
        // Persist in URL
        syncUrl();
        renderVariants();
        renderCTA();
      });
    });
    host.querySelectorAll('[data-size]').forEach(function(btn){
      btn.addEventListener('click', function(){
        selSize = btn.getAttribute('data-size');
        syncUrl();
        renderVariants();
        renderCTA();
      });
    });
  }

  /* ── CTA render ─────────────────────────────── */
  function renderCTA() {
    var v = findVariant();
    var price = v ? priceFor(v) : p.price;
    var inStock = v ? stockFor(v) > 0 : (variants.length===0 ? (p.stock==null||p.stock>0) : false);
    var needsColor = colors.length > 1 && !selColor;
    var needsSize  = hasSizes && !selSize;
    var usable = inStock && !needsColor && !needsSize;

    // Update price display
    var priceEl = document.getElementById('pdp-price');
    if(priceEl) priceEl.textContent = fmt(price);

    // Update buttons
    var addBtn = document.getElementById('pdp-add');
    var buyBtn = document.getElementById('pdp-buy');
    var addLabel = needsColor ? 'Select a colour' : needsSize ? 'Select a size' : inStock ? 'Add to cart' : 'Out of stock';
    if(addBtn){ addBtn.disabled = !usable; addBtn.textContent = addLabel; }
    if(buyBtn){ buyBtn.classList.toggle('disabled', !usable); buyBtn.textContent = usable ? 'Buy now' : 'Buy now'; }

    // Sticky bar
    if(stickyTitle) stickyTitle.textContent = p.name;
    if(stickyPrice) stickyPrice.textContent = fmt(price);
    if(stickyAdd){ stickyAdd.disabled = !usable; stickyAdd.textContent = addLabel; }

    // Bind add to cart
    if(addBtn){
      addBtn.onclick = function(){
        if(!usable) return;
        addToCart(p.id, qty, variantIdOf(v));
        showToast(p.name + ' added to cart');
      };
    }
    if(stickyAdd){
      stickyAdd.onclick = function(){
        if(!usable) return;
        addToCart(p.id, qty, variantIdOf(v));
        showToast(p.name + ' added to cart');
      };
    }
    if(buyBtn){
      buyBtn.onclick = function(e){
        if(!usable){ e.preventDefault(); return; }
        addToCart(p.id, qty, variantIdOf(v));
        window.location.href = '/checkout';
      };
    }
  }

  function findVariant() {
    var list = variantsForColor(selColor||'');
    if(!hasSizes){
      var ok = list.filter(function(v){ return stockFor(v)>0; });
      return (ok.length?ok:list)[0]||null;
    }
    return list.find(function(v){ return v.size===selSize; })||null;
  }

  /* ── Sync URL ───────────────────────────────── */
  function syncUrl() {
    var sp = new URLSearchParams(location.search);
    if(selColor) sp.set('color', selColor.toLowerCase()); else sp.delete('color');
    if(selSize)  sp.set('size', selSize);                 else sp.delete('size');
    var qs = sp.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?'+qs : ''));
  }

  /* ── Gallery swap ───────────────────────────── */
  function swapGallery(imgs) {
    // Desktop
    var mainImg = document.getElementById('pdp-main-img');
    if(mainImg){
      mainImg.classList.add('fading');
      setTimeout(function(){ mainImg.src = imgs[0]; mainImg.classList.remove('fading'); }, 180);
    }
    var thumbsWrap = document.getElementById('pdp-thumbs');
    if(thumbsWrap){
      thumbsWrap.innerHTML = imgs.map(function(u,i){
        return '<div class="pdp-thumb'+(i===0?' active':'')+'" data-idx="'+i+'" data-url="'+escapeHtml(u)+'"><img src="'+escapeHtml(u)+'" alt="" loading="lazy"></div>';
      }).join('');
      bindThumbs();
    }
    // Mobile carousel
    var carousel = document.getElementById('pdp-carousel');
    if(carousel){
      carousel.innerHTML = imgs.map(function(u){ return '<div class="pdp-carousel-item"><img src="'+escapeHtml(u)+'" alt="" loading="lazy"></div>'; }).join('');
      carousel.scrollTo({left:0});
    }
    var dotsWrap = document.getElementById('pdp-dots');
    if(dotsWrap){
      dotsWrap.innerHTML = imgs.length>1 ? imgs.map(function(_,i){ return '<button class="pdp-dot'+(i===0?' active':'')+'" data-idx="'+i+'" aria-label="Image '+(i+1)+'"></button>'; }).join('') : '';
      bindCarousel();
    }
  }

  /* ── Bind thumbs ────────────────────────────── */
  function bindThumbs() {
    var thumbs = document.querySelectorAll('.pdp-thumb');
    thumbs.forEach(function(t){
      if(t._bound) return; t._bound=true;
      t.addEventListener('click', function(){
        var mainImg = document.getElementById('pdp-main-img');
        if(mainImg){ mainImg.classList.add('fading'); setTimeout(function(){ mainImg.src=t.dataset.url; mainImg.classList.remove('fading'); }, 180); }
        thumbs.forEach(function(x){ x.classList.remove('active'); });
        t.classList.add('active');
      });
    });
    // Click-to-zoom main image
    var wrap = document.getElementById('pdp-main-wrap');
    if(wrap && !wrap._zoomBound){ wrap._zoomBound=true; wrap.addEventListener('click', function(){ wrap.classList.toggle('zoomed'); }); }
  }

  /* ── Bind carousel ──────────────────────────── */
  function bindCarousel() {
    var carousel = document.getElementById('pdp-carousel');
    var dots = document.querySelectorAll('.pdp-dot');
    if(!carousel||!dots.length) return;
    dots.forEach(function(dot){
      if(dot._bound) return; dot._bound=true;
      dot.addEventListener('click', function(){
        var idx = Number(dot.dataset.idx);
        carousel.scrollTo({ left: carousel.offsetWidth*idx, behavior:'smooth' });
      });
    });
    // Update dots on scroll
    if(!carousel._scrollBound){ carousel._scrollBound=true; carousel.addEventListener('scroll', function(){
      var idx = Math.round(carousel.scrollLeft / carousel.offsetWidth);
      dots.forEach(function(d,i){ d.classList.toggle('active',i===idx); });
    }); }
  }

  /* ── Qty stepper ────────────────────────────── */
  var qtyVal = document.getElementById('qty-val');
  document.getElementById('qty-minus').addEventListener('click',function(){ if(qty>1){ qty--; qtyVal.value=qty; } });
  document.getElementById('qty-plus').addEventListener('click',function(){ if(qty<99){ qty++; qtyVal.value=qty; } });

  /* ── Accordion ──────────────────────────────── */
  document.querySelectorAll('.pdp-accordion-head').forEach(function(head){
    head.addEventListener('click', function(){
      var item = head.parentElement;
      item.classList.toggle('open');
      head.setAttribute('aria-expanded', item.classList.contains('open'));
    });
  });

  /* ── First open description ─────────────────── */
  var firstAcc = document.querySelector('.pdp-accordion-item');
  if(firstAcc){ firstAcc.classList.add('open'); firstAcc.querySelector('.pdp-accordion-head').setAttribute('aria-expanded','true'); }

  /* ── Init ───────────────────────────────────── */
  bindThumbs();
  bindCarousel();
  renderVariants();
  renderCTA();
  syncUrl();

  // Hide variant picker if nothing to choose
  if(colors.length <= 1 && !hasSizes){
    var vhost = document.getElementById('pdp-variants');
    if(vhost) vhost.style.display='none';
  }
}
})();
</script>
</body>
</html>
