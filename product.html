<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product — Hubator</title><link rel="stylesheet" href="css/style.css">
<meta name="description" content="View product details, size guide and ordering information at Hubator.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="favicon.ico">
<meta property="og:title" content="Product — Hubator">
<meta property="og:description" content="View product details, size guide and ordering information at Hubator.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
</head>
<body><div id="site-header"></div>
<main><div class="wrap breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="crumb-name">Product</span></div><div class="wrap pd-grid" id="pd-root" aria-live="polite"><p>Loading product details…</p></div></main>
<div id="site-footer"></div>
<script src="js/maintenance.js"></script><script src="js/layout.js"></script><script src="js/config.js"></script><script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/auth.js"></script><script>
  const id = new URLSearchParams(location.search).get("id");
  loadProducts().then(() => {
    const p = getProductById(id);
    const root = document.getElementById("pd-root");
    if (!p) { root.textContent = "That product is no longer available."; return; }
    const available = productIsPurchasable(p);
    document.title = `${p.name} — Hubator`;
    document.getElementById("crumb-name").textContent = p.name;
    root.innerHTML = `<div class="pd-gallery"><div class="pd-gallery-main"><img src="${escapeHtml(safeProductImageUrl(p.img))}" alt="${escapeHtml(p.name)}"></div></div><div class="pd-info"><span class="product-cat">${escapeHtml(p.category)}</span><h1 style="font-size:2rem;">${escapeHtml(p.name)}</h1><div class="pd-price-row"><span class="pd-price">${fmt(p.price)}</span>${p.oldPrice ? `<span class="price-old">${fmt(p.oldPrice)}</span>` : ""}</div><p>${escapeHtml(p.desc)}</p>${available ? "" : '<p class="product-stock-status" role="status">Out of stock</p>'}<div class="pd-actions"><button class="btn btn-primary" data-id="${escapeHtml(p.id)}" ${available ? "" : "disabled"} onclick="addToCart(this.dataset.id)">Add to cart</button><a href="${available ? "checkout.html" : "#"}" class="btn btn-outline" data-id="${escapeHtml(p.id)}" ${available ? 'onclick="return addToCart(this.dataset.id)"' : 'aria-disabled="true"'}>Buy now</a></div><ul class="pd-meta"><li>Prices shown in Indian Rupees</li><li>Shipping is calculated securely at checkout</li></ul></div>`;
  }).catch(err => {
    console.error("[Hubator] product:", err);
    document.getElementById("pd-root").textContent = "We couldn't load this product. Please refresh and try again.";
  });
</script></body></html>
