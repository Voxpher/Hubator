<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Hubator</title>
<link rel="stylesheet" href="/css/style.css?v=4">
<meta name="description" content="Shop curated apparel and accessories from Hubator">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.ico">
<meta property="og:title" content="Shop — Hubator">
<meta property="og:description" content="Shop curated apparel and accessories from Hubator">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
<style>
/* ── Shop layout ──────────────────────────────────── */
.shop-layout{display:flex;gap:24px;align-items:flex-start;}
.shop-sidebar{
  width:190px;flex-shrink:0;
  border:1px solid var(--line);border-radius:8px;
  background:var(--white);padding:16px 14px;
  position:sticky;top:80px;
}
.shop-sidebar-section{margin-bottom:18px;}
.shop-sidebar-section:last-child{margin-bottom:0;}
.sidebar-heading{
  font-family:var(--font-mono);font-size:.67rem;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-soft);margin:0 0 9px;
}
/* Category list */
.sidebar-cats{display:flex;flex-direction:column;gap:2px;}
.sidebar-cats button{
  background:none;border:none;text-align:left;padding:6px 9px;
  border-radius:4px;font-size:.86rem;cursor:pointer;color:var(--ink);
  font-family:var(--font-body);transition:background .15s;
}
.sidebar-cats button:hover{background:var(--paper-dim);}
.sidebar-cats button.active{background:var(--ink);color:var(--paper);}
/* Color swatches */
.sidebar-swatches{display:flex;flex-wrap:wrap;gap:7px;}
.sidebar-swatch{
  width:24px;height:24px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  flex-shrink:0;
}
.sidebar-swatch:hover{transform:scale(1.15);}
.sidebar-swatch.active{
  border-color:var(--ink);
  box-shadow:0 0 0 2px var(--white),0 0 0 3.5px var(--ink);
}
/* Size chips */
.sidebar-sizes{display:flex;flex-wrap:wrap;gap:6px;}
.sidebar-size{
  font-family:var(--font-mono);font-size:.72rem;
  border:1px solid var(--line);border-radius:20px;
  padding:4px 10px;background:var(--white);
  cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s;
}
.sidebar-size:hover{border-color:var(--ink);}
.sidebar-size.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
/* Price slider */
.price-slider{width:100%;}
.price-range-labels{
  display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);margin-top:4px;
}
/* Clear btn */
.sidebar-clear{
  width:100%;padding:6px 12px;border-radius:4px;
  border:1px dashed var(--line);background:none;
  font-size:.76rem;color:var(--ink-soft);cursor:pointer;
  font-family:var(--font-mono);margin-top:2px;
  transition:border-color .15s,color .15s;
}
.sidebar-clear:hover{border-color:var(--ink);color:var(--ink);}
/* Main area — wider grid */
.shop-main{flex:1;min-width:0;}
/* Override product grid columns to use available space */
.shop-main .product-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.results-count{
  font-family:var(--font-mono);font-size:.74rem;
  color:var(--ink-soft);margin-bottom:14px;
}
/* Product card swatches — horizontal row */
.card-swatches{
  display:flex;flex-direction:row;flex-wrap:wrap;
  gap:5px;margin:6px 0 4px;
}
.card-swatch{
  width:16px;height:16px;border-radius:50%;
  border:1.5px solid rgba(22,35,31,.2);
  display:inline-block;flex-shrink:0;
}
/* Add to cart button */
.card-buy-btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 16px;background:var(--ink);color:var(--paper);
  border:none;border-radius:var(--radius);
  font-size:.82rem;font-weight:600;font-family:var(--font-body);
  cursor:pointer;white-space:nowrap;
  transition:background .2s,transform .15s;
  text-decoration:none;
}
.card-buy-btn:hover{background:var(--gold-deep);transform:translateY(-1px);}
/* Override product-foot to stack price above button */
.product-foot{flex-direction:column;align-items:flex-start;gap:8px;}
/* Mobile */
@media(max-width:760px){
  .shop-layout{flex-direction:column;}
  .shop-sidebar{width:100%;position:static;}
  .shop-main .product-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
}
@media(max-width:400px){
  .shop-main .product-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="wrap breadcrumb"><a href="/">Home</a> / Shop</div>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">All products</span>
      <h1 style="font-size:2.4rem;">Shop the collection</h1>
      <p>Curated apparel and accessories crafted for you.</p>
    </div>
  </section>

  <section class="section" style="padding-top:28px;">
    <div style="max-width:1400px;margin:0 auto;padding:0 20px;">
      <div class="shop-layout">

        <!-- ── Sidebar ───────────────────────────────── -->
        <aside class="shop-sidebar">
          <div class="shop-sidebar-section">
            <p class="sidebar-heading">Category</p>
            <div class="sidebar-cats" id="sidebar-cats">
              <button class="active" data-cat="All">All</button>
            </div>
          </div>

          <div class="shop-sidebar-section" id="color-section" style="display:none;">
            <p class="sidebar-heading">Color</p>
            <div class="sidebar-swatches" id="sidebar-swatches"></div>
          </div>

          <div class="shop-sidebar-section" id="size-section" style="display:none;">
            <p class="sidebar-heading">Size</p>
            <div class="sidebar-sizes" id="sidebar-sizes"></div>
          </div>

          <div class="shop-sidebar-section">
            <p class="sidebar-heading">Price</p>
            <input type="range" class="price-slider" id="price-slider" min="0" max="10000" step="10" value="10000">
            <div class="price-range-labels">
              <span>₹0</span>
              <span id="price-max-label">₹10,000</span>
            </div>
          </div>

          <button class="sidebar-clear" id="clear-filters">Clear all filters</button>
        </aside>

        <!-- ── Product grid ──────────────────────────── -->
        <div class="shop-main">
          <p class="results-count" id="results-count"></p>
          <div class="product-grid" id="shop-grid"></div>
        </div>

      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/maintenance.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/config.js"></script>
<script src="/js/products.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>
<script>
(function(){
  /* ── State ───────────────────────────────────────── */
  var activeCat    = "All";
  var activeColors = [];   // array of color names
  var activeSizes  = [];   // array of size names
  var maxPrice     = 10000;
  var globalMax    = 10000;

  /* ── DOM refs ────────────────────────────────────── */
  var grid       = document.getElementById("shop-grid");
  var catList    = document.getElementById("sidebar-cats");
  var swatches   = document.getElementById("sidebar-swatches");
  var sizes      = document.getElementById("sidebar-sizes");
  var slider     = document.getElementById("price-slider");
  var priceLabel = document.getElementById("price-max-label");
  var clearBtn   = document.getElementById("clear-filters");
  var countEl    = document.getElementById("results-count");

  /* ── Card HTML ───────────────────────────────────── */
  function cardHTML(p) {
    var available = productIsPurchasable(p);

    // Collect unique colors with hex — check variants Map first (has colorHex), then colorImages
    var seen = {};
    var swatchList = [];
    // Build hex lookup from variants Map
    var hexLookup = {};
    if(p.variants && typeof p.variants.forEach === "function"){
      p.variants.forEach(function(v){ if(v.color && v.colorHex) hexLookup[v.color]=v.colorHex; });
    }
    // colorImages gives color names; use hex from lookup
    (p.colorImages || []).forEach(function(ci){
      if(ci.color && !seen[ci.color]){
        seen[ci.color]=1;
        swatchList.push({name:ci.color, hex: ci.colorHex || hexLookup[ci.color] || ""});
      }
    });
    // Fall back to variants if no colorImages
    if(swatchList.length===0 && p.variants && typeof p.variants.forEach === "function"){
      p.variants.forEach(function(v){
        if(v.color && !seen[v.color]){
          seen[v.color]=1;
          swatchList.push({name:v.color, hex: v.colorHex || hexLookup[v.color] || ""});
        }
      });
    }

    var swatchHTML = "";
    if(swatchList.length>0){
      swatchHTML = '<div class="card-swatches">' +
        swatchList.slice(0,6).map(function(s){
          return '<span class="card-swatch" style="background:'+(s.hex||"#ccc")+';" title="'+escapeHtml(s.name)+'"></span>';
        }).join("") +
        (swatchList.length>6 ? '<span style="font-size:.65rem;color:var(--ink-soft);align-self:center;">+' + (swatchList.length-6) + '</span>' : '') +
      '</div>';
    }

    return '<div class="product-card" data-cat="'+escapeHtml(p.category)+'">' +
      '<a href="'+productUrl(p)+'" class="product-media">' +
        (p.badge ? '<span class="product-badge ticket '+(p.badge==="Sale"?"on-sale":"")+'">'+ escapeHtml(p.badge)+'</span>' : '')+
        '<img src="'+escapeHtml(safeProductImageUrl(p.img))+'" alt="'+escapeHtml(p.name)+'" loading="lazy">'+
      '</a>' +
      '<div class="product-body">' +
        '<span class="product-cat">'+escapeHtml(p.category)+'</span>' +
        '<h4><a href="'+productUrl(p)+'">'+escapeHtml(p.name)+'</a></h4>' +
        swatchHTML +
        '<div class="product-foot">' +
          '<div class="product-foot-price">' +
            '<span class="ticket '+(p.oldPrice?"on-sale":"")+'">' +
              (p.oldPrice ? '<span class="price-old">'+fmt(p.oldPrice)+'</span>' : '') +
              fmt(p.price) +
            '</span>' +
          '</div>' +
          '<a href="'+productUrl(p)+'" class="card-buy-btn">View &amp; Buy</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ── Filtering ───────────────────────────────────── */
  function matchesAll(p){
    // Category
    if(activeCat!=="All"){
      var cat = String(p.category||"").toLowerCase();
      var target = activeCat.toLowerCase();
      if(cat !== target) return false;
    }
    // Color
    if(activeColors.length>0){
      var pColors = new Set();
      (p.colorImages||[]).forEach(function(ci){ if(ci.color) pColors.add(ci.color); });
      if(p.variants && typeof p.variants.forEach === "function"){
        p.variants.forEach(function(v){ if(v.color) pColors.add(v.color); });
      }
      var ok=false; activeColors.forEach(function(c){ if(pColors.has(c)) ok=true; });
      if(!ok) return false;
    }
    // Size
    if(activeSizes.length>0){
      var pSizes = new Set();
      if(p.variants && typeof p.variants.forEach === "function"){
        p.variants.forEach(function(v){ if(v.size) pSizes.add(v.size); });
      }
      var ok=false; activeSizes.forEach(function(s){ if(pSizes.has(s)) ok=true; });
      if(!ok) return false;
    }
    // Price
    if(p.price > maxPrice) return false;
    return true;
  }

  function render(){
    var list = (window.PRODUCTS||[]).filter(matchesAll);
    grid.innerHTML = list.map(cardHTML).join("") ||
      '<p style="grid-column:1/-1;color:var(--ink-soft);padding:40px 0;">No products match your filters.</p>';
    if(countEl) countEl.textContent = list.length + " product" + (list.length===1?"":"s");
  }

  /* ── Build category list ─────────────────────────── */
  function buildCats(){
    var cats = Array.from(new Set((window.PRODUCTS||[]).map(function(p){ return p.category; }).filter(Boolean))).sort();
    catList.innerHTML = "";
    var allBtn = document.createElement("button");
    allBtn.textContent="All"; allBtn.dataset.cat="All";
    if(activeCat==="All") allBtn.classList.add("active");
    catList.appendChild(allBtn);
    cats.forEach(function(c){
      var btn=document.createElement("button");
      btn.textContent=c; btn.dataset.cat=c;
      if(activeCat===c) btn.classList.add("active");
      catList.appendChild(btn);
    });
  }
  catList.addEventListener("click",function(e){
    var btn=e.target.closest("button[data-cat]"); if(!btn) return;
    activeCat=btn.dataset.cat;
    catList.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active",b.dataset.cat===activeCat); });
    render();
  });

  /* ── Build color swatches ────────────────────────── */
  function buildSwatches(filterData){
    if(!filterData||!filterData.colors||filterData.colors.length===0){ document.getElementById("color-section").style.display="none"; return; }
    // Build hex map from products — check both colorImages and variants
    var hexMap={};
    (window.PRODUCTS||[]).forEach(function(p){
      (p.colorImages||[]).forEach(function(ci){ if(ci.color&&ci.colorHex) hexMap[ci.color]=ci.colorHex; });
      if(p.variants && typeof p.variants.forEach === "function"){
        p.variants.forEach(function(v){ if(v.color&&v.colorHex) hexMap[v.color]=v.colorHex; });
      }
    });
    swatches.innerHTML="";
    filterData.colors.forEach(function(name){
      var btn=document.createElement("button");
      btn.className="sidebar-swatch"; btn.dataset.color=name;
      btn.title=name; btn.setAttribute("aria-label",name);
      btn.style.background=hexMap[name]||"#ccc";
      if(activeColors.indexOf(name)>-1) btn.classList.add("active");
      swatches.appendChild(btn);
    });
    document.getElementById("color-section").style.display="block";
  }
  swatches.addEventListener("click",function(e){
    var btn=e.target.closest(".sidebar-swatch"); if(!btn) return;
    var c=btn.dataset.color;
    var idx=activeColors.indexOf(c);
    if(idx>-1){ activeColors.splice(idx,1); btn.classList.remove("active"); }
    else { activeColors.push(c); btn.classList.add("active"); }
    render();
  });

  /* ── Build size chips ────────────────────────────── */
  function buildSizes(filterData){
    if(!filterData||!filterData.sizes||filterData.sizes.length===0){ document.getElementById("size-section").style.display="none"; return; }
    sizes.innerHTML="";
    filterData.sizes.forEach(function(name){
      var btn=document.createElement("button");
      btn.className="sidebar-size"; btn.dataset.size=name; btn.textContent=name;
      if(activeSizes.indexOf(name)>-1) btn.classList.add("active");
      sizes.appendChild(btn);
    });
    document.getElementById("size-section").style.display="block";
  }
  sizes.addEventListener("click",function(e){
    var btn=e.target.closest(".sidebar-size"); if(!btn) return;
    var s=btn.dataset.size;
    var idx=activeSizes.indexOf(s);
    if(idx>-1){ activeSizes.splice(idx,1); btn.classList.remove("active"); }
    else { activeSizes.push(s); btn.classList.add("active"); }
    render();
  });

  /* ── Price slider ────────────────────────────────── */
  slider.addEventListener("input",function(){
    maxPrice=Number(slider.value);
    priceLabel.textContent="₹"+maxPrice.toLocaleString("en-IN");
    render();
  });

  /* ── Clear all ───────────────────────────────────── */
  clearBtn.addEventListener("click",function(){
    activeCat="All"; activeColors=[]; activeSizes=[]; maxPrice=globalMax;
    slider.value=globalMax;
    priceLabel.textContent="₹"+globalMax.toLocaleString("en-IN");
    catList.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active",b.dataset.cat==="All"); });
    swatches.querySelectorAll(".sidebar-swatch").forEach(function(b){ b.classList.remove("active"); });
    sizes.querySelectorAll(".sidebar-size").forEach(function(b){ b.classList.remove("active"); });
    render();
  });

  /* ── URL ?cat= param ─────────────────────────────── */
  var urlCat = (new URLSearchParams(location.search).get("cat")||"").trim();

  /* ── Boot ────────────────────────────────────────── */
  var filterData = null;

  // Load filter options from PUBLIC endpoint
  fetchFilterOptions().then(function(data){
    filterData=data;
    if(data&&data.priceMax>0){
      globalMax=data.priceMax; maxPrice=data.priceMax;
      slider.max=data.priceMax; slider.value=data.priceMax;
      priceLabel.textContent="₹"+data.priceMax.toLocaleString("en-IN");
    }
    buildSwatches(filterData);
    buildSizes(filterData);
  }).catch(function(){});

  loadProducts().then(function(){
    if(urlCat) activeCat=urlCat;
    buildCats();
    buildSwatches(filterData);
    buildSizes(filterData);
    render();
  }).catch(function(err){
    console.error("[Hubator] shop:",err);
    grid.innerHTML="<p>We couldn't load the collection. Please refresh.</p>";
  });

  window.addEventListener("hubator:products-loaded",function(){
    buildCats(); buildSwatches(filterData); buildSizes(filterData); render();
  });
  window.addEventListener("hubator:cart-changed",function(){
    if(typeof updateCartBadge==="function") updateCartBadge();
  });
})();
</script>
</body>
</html>
