<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Hubator</title>
<link rel="stylesheet" href="css/style.css">

<meta name="description" content="Shop all Hubator products — apparel, home, kitchen and accessories.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="favicon.ico">
<meta property="og:title" content="Shop — Hubator">
<meta property="og:description" content="Shop all Hubator products — apparel, home, kitchen and accessories.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="wrap breadcrumb"><a href="index.html">Home</a> / Shop</div>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">All products</span>
      <h1 style="font-size:2.4rem;">Shop the collection</h1>
      <p>12 items, sourced from independent makers.</p>
    </div>
  </section>

  <section class="section" style="padding-top:36px;">
    <div class="wrap">
      <div class="filter-bar" id="filter-bar">
        <button class="filter-chip active" data-cat="All" aria-pressed="true">All</button>
        <button class="filter-chip" data-cat="Home" aria-pressed="false">Home</button>
        <button class="filter-chip" data-cat="Kitchen" aria-pressed="false">Kitchen</button>
        <button class="filter-chip" data-cat="Apparel" aria-pressed="false">Apparel</button>
        <button class="filter-chip" data-cat="Accessories" aria-pressed="false">Accessories</button>
        <button class="filter-chip" data-cat="Bags" aria-pressed="false">Bags</button>
        <button class="filter-chip" data-cat="Footwear" aria-pressed="false">Footwear</button>
      </div>
      <div class="product-grid" id="shop-grid"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/layout.js"></script><script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script><script src="js/auth.js"></script>
<script>
  function cardHTML(p){
    return `
      <div class="product-card" data-cat="${p.category}">
        <a href="product.html?id=${p.id}" class="product-media">
          ${p.badge ? `<span class="product-badge ticket ${p.badge==='Sale'?'on-sale':''}">${p.badge}</span>` : ""}
          <img src="${p.img}" alt="${p.name}">
        </a>
        <div class="product-body">
          <span class="product-cat">${p.category}</span>
          <h4><a href="product.html?id=${p.id}">${p.name}</a></h4>
          <div class="product-foot">
            <span class="ticket ${p.oldPrice ? 'on-sale' : ''}">${p.oldPrice ? `<span class="price-old">${fmt(p.oldPrice)}</span>` : ""}${fmt(p.price)}</span>
            <button class="add-btn" aria-label="Add to cart" onclick="addToCart('${p.id}')">+</button>
          </div>
        </div>
      </div>`;
  }
  const grid = document.getElementById("shop-grid");
  function render(cat){
    const list = cat === "All" ? PRODUCTS : PRODUCTS.filter(p => p.category === cat);
    grid.innerHTML = list.map(cardHTML).join("") || `<p>No products in this category yet.</p>`;
  }
  document.querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach(c => { c.classList.remove("active"); c.setAttribute("aria-pressed","false"); });
      chip.classList.add("active");
      chip.setAttribute("aria-pressed","true");
      render(chip.dataset.cat);
    });
  });
  const params = new URLSearchParams(location.search);
  const initialCat = params.get("cat") || "All";
  document.querySelectorAll(".filter-chip").forEach(c => c.classList.toggle("active", c.dataset.cat === initialCat));
  loadProducts().then(() => render(initialCat)).catch(err => { grid.innerHTML = `<p>${err.message}</p>`; });
</script>
</body>
</html>
