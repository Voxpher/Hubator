<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Hubator</title>
<link rel="stylesheet" href="/css/style.css?v=3">

<meta name="description" content="Shop curated apparel and fashion from Hubator — unique clothing and accessories">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.ico">
<meta property="og:title" content="Shop — Hubator">
<meta property="og:description" content="Shop curated apparel and fashion from Hubator — unique clothing and accessories">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">

<style>
  /* ===== Shop filter layout — scoped with flt- prefix so nothing here collides with style.css ===== */
  .shop-layout{display:flex;gap:32px;align-items:flex-start;}
  .flt-sidebar{width:260px;flex-shrink:0;position:sticky;top:20px;}
  .shop-main{flex:1;min-width:0;}

  .flt-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .flt-results-count{font-family:var(--font-mono),monospace;font-size:.8rem;color:var(--ink);opacity:.7;}
  .flt-sort select{font-family:var(--font-mono),monospace;font-size:.8rem;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink);cursor:pointer;}
  .flt-mobile-btn{display:none;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--ink);border-radius:20px;background:var(--white);color:var(--ink);font-size:.85rem;cursor:pointer;font-family:inherit;}
  .flt-mobile-btn .flt-badge{background:var(--rust);color:var(--white);border-radius:50%;min-width:18px;height:18px;font-size:.65rem;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}

  .flt-section{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--line);}
  .flt-section:last-of-type{border-bottom:none;}
  .flt-section-title{font-family:var(--font-mono),monospace;text-transform:uppercase;font-size:.72rem;letter-spacing:.06em;margin-bottom:12px;color:var(--ink);}

  .flt-checkbox-row{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:.88rem;color:var(--ink);user-select:none;}
  .flt-checkbox-row input{width:15px;height:15px;accent-color:var(--ink);cursor:pointer;flex-shrink:0;}
  .flt-checkbox-row .flt-count{margin-left:auto;opacity:.5;font-size:.78rem;font-family:var(--font-mono),monospace;}

  .flt-swatch-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .flt-swatch-btn{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative;flex-shrink:0;}
  .flt-swatch-btn.selected{border-color:var(--ink);box-shadow:0 0 0 2px var(--white),0 0 0 3px var(--ink);}
  .flt-swatch-btn[data-light="1"]{border-color:#d8d3c7;}

  .flt-chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .flt-size-btn{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-size:.82rem;color:var(--ink);font-family:inherit;min-width:40px;text-align:center;}
  .flt-size-btn.selected{background:var(--ink);color:var(--white);border-color:var(--ink);}

  .flt-star-btn{display:flex;align-items:center;gap:6px;padding:6px 0;width:100%;background:none;border:none;cursor:pointer;font-size:.85rem;color:var(--ink);font-family:inherit;text-align:left;}
  .flt-star-btn.selected{font-weight:600;}
  .flt-star-btn .stars{color:#d4a017;letter-spacing:1px;}

  .flt-price-values{display:flex;justify-content:space-between;font-family:var(--font-mono),monospace;font-size:.82rem;color:var(--ink);margin-bottom:10px;}
  .flt-price-slider{position:relative;height:32px;}
  .flt-price-track{position:absolute;left:0;right:0;top:14px;height:4px;background:var(--line);border-radius:2px;}
  .flt-price-fill{position:absolute;top:14px;height:4px;background:var(--ink);border-radius:2px;}
  .flt-price-slider input[type="range"]{position:absolute;left:0;right:0;top:8px;width:100%;height:16px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;}
  .flt-price-slider input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;width:16px;height:16px;border-radius:50%;background:var(--ink);cursor:pointer;border:2px solid var(--white);box-shadow:0 0 0 1px var(--ink);}
  .flt-price-slider input[type="range"]::-moz-range-thumb{pointer-events:all;width:16px;height:16px;border-radius:50%;background:var(--ink);cursor:pointer;border:2px solid var(--white);box-shadow:0 0 0 1px var(--ink);}
  .flt-price-slider input[type="range"]::-moz-range-track{background:transparent;}

  .flt-clear-btn{width:100%;padding:10px 16px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:.82rem;cursor:pointer;font-family:inherit;}
  .flt-clear-btn:hover{border-color:var(--ink);}

  .product-card .color-swatch{transition:transform .15s ease;}
  .product-card .color-swatch:hover{transform:scale(1.15);}
  .product-short-desc{font-size:.78rem;color:var(--muted);margin:8px 0 12px;line-height:1.4;}
  .product-full-desc{font-size:.7rem;color:var(--muted);float:right;cursor:help;line-height:1.2;}
  .flt-swatch-row{display:flex;gap:4px;margin:6px 0;}

  .flt-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;}
  .flt-backdrop.flt-open{display:block;}

  @media (max-width: 900px){
    .flt-mobile-btn{display:inline-flex;}
    .shop-layout{display:block;}
    .flt-sidebar{
      position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
      max-height:82vh;overflow-y:auto;background:var(--white);
      border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);
      padding:20px 20px 100px;z-index:50;
      transform:translateY(100%);transition:transform .25s ease;
    }
    .flt-sidebar.flt-open{transform:translateY(0);}
    .flt-sidebar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:0;background:var(--white);padding-bottom:10px;}
    .flt-sidebar-header button{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--ink);line-height:1;}
    .flt-apply-btn{position:fixed;left:16px;right:16px;bottom:16px;z-index:51;padding:14px;background:var(--ink);color:var(--white);border:none;border-radius:10px;font-size:.95rem;cursor:pointer;display:none;font-family:inherit;}
    .flt-sidebar.flt-open ~ .flt-apply-btn,.flt-apply-btn.flt-open{display:block;}
  }
  @media (min-width: 901px){
    .flt-sidebar-header{display:none;}
  }
</style>
</head>

<body>

<div id="site-header"></div>

<main>
  <div class="wrap breadcrumb"><a href="/">Home</a> / Shop</div>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">All products</span>
      <h1 style="font-size:2.4rem;">Shop the collection</h1>
      <p>Curated apparel and accessories from independent designers.</p>
    </div>
  </section>

  <section class="section" style="padding-top:36px;">
    <div class="wrap">

      <div class="flt-toolbar">
        <button type="button" class="flt-mobile-btn" id="flt-mobile-btn">
          Filters <span class="flt-badge" id="flt-mobile-count">0</span>
        </button>
        <span class="flt-results-count" id="flt-results-count">Loading…</span>
        <div class="flt-sort">
          <select id="flt-sort-select" aria-label="Sort products">
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating-desc">Highest Rated</option>
            <option value="name-asc">Name: A–Z</option>
          </select>
        </div>
      </div>

      <div class="shop-layout">

        <aside class="flt-sidebar" id="flt-sidebar">
          <div class="flt-sidebar-header">
            <strong>Filters</strong>
            <button type="button" id="flt-close-btn" aria-label="Close filters">&times;</button>
          </div>

          <div class="flt-section" id="flt-section-price">
            <div class="flt-section-title">Price</div>
            <div class="flt-price-values">
              <span id="flt-price-min-label">₹0</span>
              <span id="flt-price-max-label">₹0</span>
            </div>
            <div class="flt-price-slider">
              <div class="flt-price-track"></div>
              <div class="flt-price-fill" id="flt-price-fill"></div>
              <input type="range" id="flt-price-min" min="0" max="10000" step="10" value="0">
              <input type="range" id="flt-price-max" min="0" max="10000" step="10" value="10000">
            </div>
          </div>

          <div class="flt-section" id="flt-section-category">
            <div class="flt-section-title">Category</div>
            <div id="flt-category-list"></div>
          </div>

          <div class="flt-section" id="flt-section-color" style="display:none;">
            <div class="flt-section-title">Color</div>
            <div class="flt-swatch-grid" id="flt-color-list"></div>
          </div>

          <div class="flt-section" id="flt-section-size" style="display:none;">
            <div class="flt-section-title">Size</div>
            <div class="flt-chip-grid" id="flt-size-list"></div>
          </div>

          <div class="flt-section" id="flt-section-rating" style="display:none;">
            <div class="flt-section-title">Rating</div>
            <div id="flt-rating-list"></div>
          </div>

          <button type="button" class="flt-clear-btn" id="flt-clear-btn">Clear all filters</button>
        </aside>

        <div class="shop-main">
          <div class="product-grid" id="shop-grid"></div>
        </div>

      </div>
    </div>
  </section>
</main>

<div class="flt-backdrop" id="flt-backdrop"></div>
<button type="button" class="flt-apply-btn" id="flt-apply-btn">Show results</button>

<div id="site-footer"></div>

<script src="/js/maintenance.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/config.js"></script>
<script src="/js/products.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>
<script>
(function () {
  "use strict";

  var grid = document.getElementById("shop-grid");
  var sidebar = document.getElementById("flt-sidebar");
  var backdrop = document.getElementById("flt-backdrop");
  var mobileBtn = document.getElementById("flt-mobile-btn");
  var mobileCount = document.getElementById("flt-mobile-count");
  var closeBtn = document.getElementById("flt-close-btn");
  var applyBtn = document.getElementById("flt-apply-btn");
  var clearBtn = document.getElementById("flt-clear-btn");
  var resultsCountEl = document.getElementById("flt-results-count");
  var sortSelect = document.getElementById("flt-sort-select");

  var priceMinInput = document.getElementById("flt-price-min");
  var priceMaxInput = document.getElementById("flt-price-max");
  var priceMinLabel = document.getElementById("flt-price-min-label");
  var priceMaxLabel = document.getElementById("flt-price-max-label");
  var priceFill = document.getElementById("flt-price-fill");

  var categoryListEl = document.getElementById("flt-category-list");
  var colorListEl = document.getElementById("flt-color-list");
  var sizeListEl = document.getElementById("flt-size-list");
  var ratingListEl = document.getElementById("flt-rating-list");

  // ---- Category group map (kept for compatibility with header "Categories" menu links like /shop?cat=Man) ----
  var GROUP_OF_CATEGORY = { "Man": "Man", "Woman": "Woman", "Accessories": "Accessories" };
  var categoryGroups = {};
  function refreshCategoryGroups() {
    categoryGroups = Object.assign({}, GROUP_OF_CATEGORY);
    try {
      var cached = JSON.parse(localStorage.getItem("hubator_category_nav_v2") || "null");
      if (Array.isArray(cached)) {
        cached.forEach(function (entry) {
          (entry.items || []).forEach(function (item) {
            var name = typeof item === "string" ? item : (item.name || (Array.isArray(item) ? item[0] : ""));
            if (name) categoryGroups[name] = entry.group;
          });
        });
      }
    } catch (e) { /* keep fallback map */ }
  }

  // ---- Filter state ----
  var state = {
    categories: new Set(),
    colors: new Set(),
    sizes: new Set(),
    minRating: 0,
    minPrice: 0,
    maxPrice: 10000,
    sort: "newest"
  };

  var bounds = { minPrice: 0, maxPrice: 10000 };
  var options = { categories: [], colors: [], sizes: [], hasRatings: false };

  function escapeAttr(str) {
    return String(str == null ? "" : str).replace(/"/g, "&quot;");
  }

  // ---- Derive available filter options directly from the loaded product catalog ----
  function deriveOptions(products) {
    var catCounts = {};
    var colorMap = {}; // name(lower) -> { name, hex, count }
    var sizeCounts = {};
    var minP = Infinity, maxP = 0;
    var anyRating = false;

    products.forEach(function (p) {
      if (p.category) catCounts[p.category] = (catCounts[p.category] || 0) + 1;
      if (typeof p.price === "number") {
        if (p.price < minP) minP = p.price;
        if (p.price > maxP) maxP = p.price;
      }
      if (typeof p.rating === "number" && p.rating > 0) anyRating = true;
      if (p.variants && typeof p.variants.forEach === "function") {
        p.variants.forEach(function (v) {
          if (v.color) {
            var key = v.color.toLowerCase();
            if (!colorMap[key]) colorMap[key] = { name: v.color, hex: v.colorHex || "#cccccc", count: 0 };
            colorMap[key].count++;
          }
          if (v.size) sizeCounts[v.size] = (sizeCounts[v.size] || 0) + 1;
        });
      }
    });

    if (minP === Infinity) minP = 0;
    if (maxP === 0) maxP = minP;

    var categories = Object.keys(catCounts).sort().map(function (name) {
      return { name: name, count: catCounts[name] };
    });
    var colors = Object.keys(colorMap).map(function (k) { return colorMap[k]; }).sort(function (a, b) {
      return a.name.localeCompare(b.name);
    });
    var sizeOrder = ["XS", "S", "M", "L", "XL", "XXL", "XXXL"];
    var sizes = Object.keys(sizeCounts).sort(function (a, b) {
      var ia = sizeOrder.indexOf(a), ib = sizeOrder.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    }).map(function (name) { return { name: name, count: sizeCounts[name] }; });

    return {
      categories: categories,
      colors: colors,
      sizes: sizes,
      hasRatings: anyRating,
      minPrice: Math.floor(minP),
      maxPrice: Math.ceil(maxP)
    };
  }

  // ---- Build sidebar UI from derived options ----
  function buildSidebar() {
    categoryListEl.innerHTML = "";
    options.categories.forEach(function (opt) {
      var row = document.createElement("label");
      row.className = "flt-checkbox-row";
      row.innerHTML =
        '<input type="checkbox" value="' + escapeAttr(opt.name) + '">' +
        '<span>' + escapeAttr(opt.name) + '</span>' +
        '<span class="flt-count">' + opt.count + '</span>';
      var input = row.querySelector("input");
      input.checked = state.categories.has(opt.name);
      input.addEventListener("change", function () {
        if (input.checked) state.categories.add(opt.name); else state.categories.delete(opt.name);
        onFilterChange();
      });
      categoryListEl.appendChild(row);
    });

    var colorSection = document.getElementById("flt-section-color");
    if (options.colors.length > 0) {
      colorSection.style.display = "";
      colorListEl.innerHTML = "";
      options.colors.forEach(function (opt) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "flt-swatch-btn" + (state.colors.has(opt.name) ? " selected" : "");
        btn.style.background = opt.hex;
        btn.title = opt.name + " (" + opt.count + ")";
        btn.setAttribute("aria-label", opt.name);
        if (/^#(fff(fff)?|ffffff)$/i.test(opt.hex)) btn.setAttribute("data-light", "1");
        btn.addEventListener("click", function () {
          if (state.colors.has(opt.name)) state.colors.delete(opt.name); else state.colors.add(opt.name);
          btn.classList.toggle("selected");
          onFilterChange();
        });
        colorListEl.appendChild(btn);
      });
    } else {
      colorSection.style.display = "none";
    }

    var sizeSection = document.getElementById("flt-section-size");
    if (options.sizes.length > 0) {
      sizeSection.style.display = "";
      sizeListEl.innerHTML = "";
      options.sizes.forEach(function (opt) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "flt-size-btn" + (state.sizes.has(opt.name) ? " selected" : "");
        btn.textContent = opt.name;
        btn.title = opt.count + " available";
        btn.addEventListener("click", function () {
          if (state.sizes.has(opt.name)) state.sizes.delete(opt.name); else state.sizes.add(opt.name);
          btn.classList.toggle("selected");
          onFilterChange();
        });
        sizeListEl.appendChild(btn);
      });
    } else {
      sizeSection.style.display = "none";
    }

    var ratingSection = document.getElementById("flt-section-rating");
    if (options.hasRatings) {
      ratingSection.style.display = "";
      ratingListEl.innerHTML = "";
      [4, 3, 2].forEach(function (n) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "flt-star-btn" + (state.minRating === n ? " selected" : "");
        btn.innerHTML = '<span class="stars">' + "★".repeat(n) + "☆".repeat(5 - n) + '</span><span>&amp; up</span>';
        btn.addEventListener("click", function () {
          state.minRating = (state.minRating === n) ? 0 : n;
          Array.prototype.forEach.call(ratingListEl.children, function (c) { c.classList.remove("selected"); });
          if (state.minRating === n) btn.classList.add("selected");
          onFilterChange();
        });
        ratingListEl.appendChild(btn);
      });
    } else {
      ratingSection.style.display = "none";
    }

    priceMinInput.min = bounds.minPrice;
    priceMinInput.max = bounds.maxPrice;
    priceMaxInput.min = bounds.minPrice;
    priceMaxInput.max = bounds.maxPrice;
    if (state.minPrice < bounds.minPrice) state.minPrice = bounds.minPrice;
    if (state.maxPrice > bounds.maxPrice || state.maxPrice === 10000) state.maxPrice = bounds.maxPrice;
    priceMinInput.value = state.minPrice;
    priceMaxInput.value = state.maxPrice;
    updatePriceUI();
  }

  function updatePriceUI() {
    var min = Number(priceMinInput.value);
    var max = Number(priceMaxInput.value);
    if (min > max) { var t = min; min = max; max = t; }
    priceMinLabel.textContent = "₹" + min;
    priceMaxLabel.textContent = "₹" + max;
    var range = (bounds.maxPrice - bounds.minPrice) || 1;
    var leftPct = ((min - bounds.minPrice) / range) * 100;
    var rightPct = ((max - bounds.minPrice) / range) * 100;
    priceFill.style.left = leftPct + "%";
    priceFill.style.width = Math.max(0, rightPct - leftPct) + "%";
  }

  priceMinInput.addEventListener("input", function () {
    if (Number(priceMinInput.value) > Number(priceMaxInput.value)) priceMinInput.value = priceMaxInput.value;
    updatePriceUI();
  });
  priceMaxInput.addEventListener("input", function () {
    if (Number(priceMaxInput.value) < Number(priceMinInput.value)) priceMaxInput.value = priceMinInput.value;
    updatePriceUI();
  });
  priceMinInput.addEventListener("mousedown", function () { priceMinInput.style.zIndex = 3; priceMaxInput.style.zIndex = 2; });
  priceMaxInput.addEventListener("mousedown", function () { priceMaxInput.style.zIndex = 3; priceMinInput.style.zIndex = 2; });
  priceMinInput.addEventListener("touchstart", function () { priceMinInput.style.zIndex = 3; priceMaxInput.style.zIndex = 2; });
  priceMaxInput.addEventListener("touchstart", function () { priceMaxInput.style.zIndex = 3; priceMinInput.style.zIndex = 2; });
  priceMinInput.addEventListener("change", function () { state.minPrice = Number(priceMinInput.value); onFilterChange(); });
  priceMaxInput.addEventListener("change", function () { state.maxPrice = Number(priceMaxInput.value); onFilterChange(); });

  sortSelect.addEventListener("change", function () {
    state.sort = sortSelect.value;
    onFilterChange();
  });

  // ---- Matching ----
  function matchesCategory(product) {
    if (state.categories.size === 0) return true;
    if (state.categories.has(product.category)) return true;
    var group = categoryGroups[product.category || ""];
    return group ? state.categories.has(group) : false;
  }
  function matchesColor(product) {
    if (state.colors.size === 0) return true;
    if (!product.variants) return false;
    var found = false;
    product.variants.forEach(function (v) {
      if (v.color) {
        state.colors.forEach(function (c) {
          if (v.color.toLowerCase() === c.toLowerCase()) found = true;
        });
      }
    });
    return found;
  }
  function matchesSize(product) {
    if (state.sizes.size === 0) return true;
    if (!product.variants) return false;
    var found = false;
    product.variants.forEach(function (v) {
      if (v.size && state.sizes.has(v.size)) found = true;
    });
    return found;
  }
  function matchesRating(product) {
    if (!state.minRating) return true;
    return typeof product.rating === "number" && product.rating >= state.minRating;
  }
  function matchesPrice(product) {
    return typeof product.price === "number" && product.price >= state.minPrice && product.price <= state.maxPrice;
  }

  function sortProducts(list) {
    var arr = list.slice();
    switch (state.sort) {
      case "price-asc": return arr.sort(function (a, b) { return a.price - b.price; });
      case "price-desc": return arr.sort(function (a, b) { return b.price - a.price; });
      case "rating-desc": return arr.sort(function (a, b) { return (b.rating || 0) - (a.rating || 0); });
      case "name-asc": return arr.sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
      default: return arr;
    }
  }

  // ---- Card rendering (keeps existing card classes so style.css still applies) ----
  function cardHTML(p) {
    var available = productIsPurchasable(p);
    var hasVariants = p.variants && p.variants.size > 0;
    var colors = [];
    var colorHexByName = {};
    if (hasVariants) {
      p.variants.forEach(function (v) {
        if (v.color && colors.indexOf(v.color) === -1) {
          colors.push(v.color);
          colorHexByName[v.color] = v.colorHex || "#cccccc";
        }
      });
    }
    var swatchesHTML = "";
    var maxShow = 3;
    if (colors.length > 0) {
      swatchesHTML += '<div class="flt-swatch-row">';
      for (var i = 0; i < Math.min(colors.length, maxShow); i++) {
        var name = colors[i];
        swatchesHTML += '<span class="color-swatch" style="width:20px;height:20px;border-radius:50%;background:' +
          escapeAttr(colorHexByName[name]) + ';border:1px solid var(--line);display:inline-block;flex-shrink:0;" title="' +
          escapeAttr(name) + '"></span>';
      }
      if (colors.length > maxShow) {
        swatchesHTML += '<span class="color-swatch" style="width:20px;height:20px;border-radius:50%;background:var(--line);' +
          'border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;" ' +
          'title="' + (colors.length - maxShow) + ' more colors">+' + (colors.length - maxShow) + '</span>';
      }
      swatchesHTML += '</div>';
    }

    var shortDesc = (p.shortDescription || "").trim();
    var fullDesc = (p.fullDescription || "").trim();

    return (
      '<div class="product-card" data-cat="' + escapeHtml(p.category) + '">' +
        '<a href="' + productUrl(p) + '" class="product-media">' +
          (p.badge ? '<span class="product-badge ticket ' + (p.badge === "Sale" ? "on-sale" : "") + '">' + escapeHtml(p.badge) + '</span>' : "") +
          '<img src="' + escapeHtml(safeProductImageUrl(p.img)) + '" alt="' + escapeHtml(p.name) + '">' +
        '</a>' +
        '<div class="product-body">' +
          '<span class="product-cat">' + escapeHtml(p.category) + '</span>' +
          '<h4><a href="' + productUrl(p) + '">' + escapeHtml(p.name) + '</a></h4>' +
          (shortDesc ? '<p class="product-short-desc">' + escapeHtml(shortDesc) + '</p>' : '') +
          swatchesHTML +
          '<div class="product-foot">' +
            '<span class="ticket ' + (p.oldPrice ? "on-sale" : "") + '">' +
              (p.oldPrice ? '<span class="price-old">' + fmt(p.oldPrice) + '</span>' : "") + fmt(p.price) +
            '</span>' +
            (hasVariants ? '<div class="product-variants">' +
              colors.slice(0, 2).map(function (name) {
                var sizes = [];
                p.variants.forEach(function (v) {
                  if (v.color === name && v.size && sizes.indexOf(v.size) === -1) sizes.push(v.size);
                });
                return '<span>' + escapeHtml(name) + (sizes.length ? " · " + escapeHtml(sizes.join(", ")) : "") + '</span>';
              }).join("") + '</div>' : "") +
            '<button class="add-btn" data-id="' + escapeHtml(p.id) + '" aria-label="' +
              (available ? "Add " + escapeHtml(p.name) + " to cart" : escapeHtml(p.name) + " is out of stock") + '" ' +
              (available ? "" : "disabled") + ' onclick="addToCart(this.dataset.id)">' + (available ? "+" : "—") + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderGrid() {
    var list = (window.PRODUCTS || []).filter(function (p) {
      return matchesCategory(p) && matchesColor(p) && matchesSize(p) && matchesRating(p) && matchesPrice(p);
    });
    list = sortProducts(list);
    grid.innerHTML = list.map(cardHTML).join("") ||
      '<div style="grid-column:1/-1;text-align:center;padding:48px 16px;">' +
        '<p style="margin-bottom:12px;">No products match these filters.</p>' +
        '<button type="button" class="flt-clear-btn" style="width:auto;padding:10px 20px;" onclick="document.getElementById(\'flt-clear-btn\').click()">Clear filters</button>' +
      '</div>';
    resultsCountEl.textContent = list.length + (list.length === 1 ? " product found" : " products found");
  }

  function activeFilterCount() {
    var n = state.categories.size + state.colors.size + state.sizes.size + (state.minRating ? 1 : 0);
    if (state.minPrice > bounds.minPrice || state.maxPrice < bounds.maxPrice) n++;
    return n;
  }

  function syncUrl() {
    var url = new URL(location.href);
    var params = url.searchParams;
    state.categories.size ? params.set("category", Array.from(state.categories).join(",")) : params.delete("category");
    state.colors.size ? params.set("colors", Array.from(state.colors).join(",")) : params.delete("colors");
    state.sizes.size ? params.set("sizes", Array.from(state.sizes).join(",")) : params.delete("sizes");
    state.minRating ? params.set("minRating", state.minRating) : params.delete("minRating");
    (state.minPrice > bounds.minPrice) ? params.set("minPrice", state.minPrice) : params.delete("minPrice");
    (state.maxPrice < bounds.maxPrice) ? params.set("maxPrice", state.maxPrice) : params.delete("maxPrice");
    (state.sort !== "newest") ? params.set("sort", state.sort) : params.delete("sort");
    params.delete("cat");
    history.replaceState({}, "", url);
  }

  function onFilterChange() {
    mobileCount.textContent = activeFilterCount();
    renderGrid();
    syncUrl();
  }

  // ---- Mobile sheet open/close ----
  function openSheet() {
    sidebar.classList.add("flt-open");
    backdrop.classList.add("flt-open");
    applyBtn.classList.add("flt-open");
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    sidebar.classList.remove("flt-open");
    backdrop.classList.remove("flt-open");
    applyBtn.classList.remove("flt-open");
    document.body.style.overflow = "";
  }
  mobileBtn.addEventListener("click", openSheet);
  closeBtn.addEventListener("click", closeSheet);
  backdrop.addEventListener("click", closeSheet);
  applyBtn.addEventListener("click", closeSheet);

  clearBtn.addEventListener("click", function () {
    state.categories.clear();
    state.colors.clear();
    state.sizes.clear();
    state.minRating = 0;
    state.minPrice = bounds.minPrice;
    state.maxPrice = bounds.maxPrice;
    state.sort = "newest";
    sortSelect.value = "newest";
    buildSidebar();
    onFilterChange();
  });

  // ---- Read initial state from URL (supports old ?cat=Man links from header nav too) ----
  function readUrlState() {
    var params = new URLSearchParams(location.search);
    var catParam = (params.get("category") || params.get("cat") || "").trim();
    if (catParam) {
      catParam.split(",").forEach(function (c) { if (c) state.categories.add(c); });
    }
    (params.get("colors") || "").split(",").forEach(function (c) { if (c) state.colors.add(c); });
    (params.get("sizes") || "").split(",").forEach(function (s) { if (s) state.sizes.add(s); });
    state.minRating = Number(params.get("minRating")) || 0;
    if (params.get("minPrice")) state.minPrice = Number(params.get("minPrice"));
    if (params.get("maxPrice")) state.maxPrice = Number(params.get("maxPrice"));
    if (params.get("sort")) { state.sort = params.get("sort"); sortSelect.value = state.sort; }
  }

  // ---- Boot ----
  function init(products) {
    window.PRODUCTS = products;
    refreshCategoryGroups();
    options = deriveOptions(products);
    bounds = { minPrice: options.minPrice, maxPrice: options.maxPrice || options.minPrice + 1 };
    if (state.minPrice === 0) state.minPrice = bounds.minPrice;
    if (state.maxPrice === 10000) state.maxPrice = bounds.maxPrice;

    // If the URL asked for a group ("Man"/"Woman") expand it to member categories
    var expanded = new Set();
    state.categories.forEach(function (c) {
      if (options.categories.some(function (o) { return o.name === c; })) {
        expanded.add(c);
      } else {
        options.categories.forEach(function (o) {
          if (categoryGroups[o.name] === c) expanded.add(o.name);
        });
      }
    });
    state.categories = expanded;

    buildSidebar();
    onFilterChange();
  }

  readUrlState();

  loadProducts().then(init).catch(function (err) {
    console.error("[Hubator] shop:", err);
    grid.innerHTML = "<p>We couldn't load the collection. Please refresh and try again.</p>";
    resultsCountEl.textContent = "";
  });

  window.addEventListener("hubator:products-loaded", function () {
    loadProducts().then(init);
  });
  window.addEventListener("hubator:cart-changed", function () {
    if (typeof updateCartBadge === "function") updateCartBadge();
  });
})();
</script>
</body>
</html>
