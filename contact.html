<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Hubator</title>
<meta name="description" content="Get in touch with the Hubator team.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="favicon.ico">
<meta property="og:title" content="Contact — Hubator">
<meta property="og:description" content="Get in touch with the Hubator team.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main-content">
  <div class="wrap breadcrumb"><a href="index.html">Home</a> / Contact</div>
  <section class="page-hero" style="border-bottom:none;">
    <div class="wrap">
      <span class="eyebrow">Get in touch</span>
      <h1>We reply within a day</h1>
    </div>
  </section>

  <div class="wrap contact-grid">
    <div>
      <div class="contact-info-card">
        <h3 style="font-size:0.95rem;margin-bottom:4px;display:flex;align-items:center;gap:8px"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Email</h3>
        <p><a href="mailto:support@hubator.com">support@hubator.com</a></p>
      </div>
      <div class="contact-info-card">
        <h3 style="font-size:0.95rem;margin-bottom:4px;display:flex;align-items:center;gap:8px"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Phone / WhatsApp</h3>
        <p><a href="tel:+919242036989">+91 9242036989</a></p>
      </div>
      <div class="contact-info-card">
        <h3 style="font-size:0.95rem;margin-bottom:4px;display:flex;align-items:center;gap:8px"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Location</h3>
        <p>Gangarampur, West Bengal, India — 733124</p>
      </div>
      <div class="contact-info-card">
        <h3 style="font-size:0.95rem;margin-bottom:4px;display:flex;align-items:center;gap:8px"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Hours</h3>
        <p>Mon–Sat, 9am–6pm IST</p>
      </div>
    </div>

    <form id="contact-form" onsubmit="event.preventDefault(); showToast('Message sent — we\'ll reply soon'); this.reset();" novalidate>
      <div class="form-row">
        <div class="form-field">
          <label for="ct-name">Name</label>
          <input id="ct-name" type="text" name="name" required autocomplete="name">
        </div>
        <div class="form-field">
          <label for="ct-email">Email</label>
          <input id="ct-email" type="email" name="email" required autocomplete="email">
        </div>
      </div>
      <div class="form-field">
        <label for="ct-subject">Subject <span style="color:#9ca3af;font-size:0.8em;font-weight:400">(optional)</span></label>
        <input id="ct-subject" type="text" name="subject">
      </div>
      <div class="form-field">
        <label for="ct-message">Message</label>
        <textarea id="ct-message" name="message" required rows="5"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send message</button>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/maintenance.js"></script><script src="js/layout.js"></script>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
