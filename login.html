<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Hubator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-bar">
    <a href="index.html" class="logo">Hubator</a>
    <nav class="main-nav"><ul><li><a href="shop.html">Shop</a></li></ul></nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-link" aria-label="Cart">🛍️<span class="cart-count">0</span></a>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h2 style="margin-bottom:6px;">Welcome back</h2>
      <p style="margin-bottom:26px;color:#6b7280;">Sign in to check out faster and track your orders.</p>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" required autocomplete="email" placeholder="you@email.com">
        </div>
        <div class="form-field">
          <label for="login-password" style="display:flex;justify-content:space-between;align-items:center;">
            <span>Password</span>
            <a href="forgot-password.html" style="font-size:0.8rem;font-weight:400;color:#f59e0b;">Forgot password?</a>
          </label>
          <input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <p id="login-form-error" role="alert" style="display:none;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:0.5rem 0.75rem;font-size:0.85rem;margin-bottom:0.75rem;"></p>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p class="auth-switch" style="margin-top:20px;text-align:center;">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© 2026 Hubator. All rights reserved.</span><span style="font-size:0.8rem;margin-left:1rem;"><a href="privacy-policy.html" style="color:#9ca3af;text-decoration:none;margin:0 0.4rem;">Privacy</a><a href="terms-conditions.html" style="color:#9ca3af;text-decoration:none;margin:0 0.4rem;">Terms</a><a href="shipping-policy.html" style="color:#9ca3af;text-decoration:none;margin:0 0.4rem;">Shipping</a><a href="refund-policy.html" style="color:#9ca3af;text-decoration:none;margin:0 0.4rem;">Refunds</a></span>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
  // Already signed in → go home
  if (isSignedIn()) window.location.href = "index.html";

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearAuthError("login-form");
    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    btn.textContent = "Signing in…";
    try {
      await signIn(
        document.getElementById("login-email").value.trim(),
        document.getElementById("login-password").value
      );
      const next = new URLSearchParams(location.search).get("next") || "index.html";
      window.location.href = next;
    } catch (err) {
      const msg = err.message.includes("verify") ? err.message + " <a href=\"forgot-password.html\">Resend link?</a>" : err.message; document.getElementById("login-form-error").innerHTML = msg; document.getElementById("login-form-error").style.display = "block";
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
