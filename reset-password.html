<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Hubator</title>
<link rel="stylesheet" href="css/style.css">

<meta name="description" content="Set a new password for your Hubator account.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="favicon.ico">
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Reset password — Hubator">
<meta property="og:description" content="Set a new password for your Hubator account.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="auth-wrap">
    <div class="auth-card">

      <!-- Invalid / missing token state -->
      <div id="reset-invalid" style="display:none;text-align:center;padding:1rem 0;">
        <div style="margin-bottom:0.75rem;color:var(--gold,#C99A2E)"><svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
        <h3 style="margin:0 0 0.5rem;">Invalid or expired link</h3>
        <p style="color:#6b7280;font-size:0.9rem;margin:0 0 1.5rem;">
          This reset link has expired or is invalid. Please request a new one.
        </p>
        <a href="forgot-password.html" class="btn btn-primary btn-block">Request new link</a>
      </div>

      <!-- Reset form -->
      <div id="reset-form-wrap">
        <h2 style="margin-bottom:6px;">Set a new password</h2>
        <p style="margin-bottom:26px;color:#6b7280;">Choose a strong password for your account.</p>

        <form id="reset-form" novalidate>
          <div class="form-field">
            <label for="reset-password">New password <span style="color:#9ca3af;font-size:0.78rem;font-weight:400">(min 8 characters)</span></label>
            <input id="reset-password" type="password" required autocomplete="new-password" placeholder="••••••••" minlength="8">
          </div>
          <div class="form-field">
            <label for="reset-confirm">Confirm new password</label>
            <input id="reset-confirm" type="password" required autocomplete="new-password" placeholder="••••••••">
          </div>

          <p id="reset-form-error" role="alert" style="display:none;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:0.5rem 0.75rem;font-size:0.85rem;margin-bottom:0.75rem;"></p>

          <button type="submit" id="reset-btn" class="btn btn-primary btn-block">Update password</button>
        </form>
      </div>

      <!-- Success state -->
      <div id="reset-success" style="display:none;text-align:center;padding:1rem 0;">
        <div style="margin-bottom:0.75rem;color:var(--sage,#7C9473)"><svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
        <h3 style="margin:0 0 0.5rem;">Password updated!</h3>
        <p style="color:#6b7280;font-size:0.9rem;margin:0 0 1.5rem;">
          You're now signed in. Redirecting you to the homepage…
        </p>
      </div>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/maintenance.js"></script><script src="js/layout.js"></script><script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
  // Extract token from URL ?token=...
  const resetToken = new URLSearchParams(location.search).get("token");

  if (!resetToken || resetToken.length !== 64) {
    document.getElementById("reset-form-wrap").style.display = "none";
    document.getElementById("reset-invalid").style.display = "block";
  }

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearAuthError("reset-form");

    const pass = document.getElementById("reset-password").value;
    const conf = document.getElementById("reset-confirm").value;

    if (pass.length < 8) { showAuthError("reset-form", "Password must be at least 8 characters."); return; }
    if (pass !== conf)   { showAuthError("reset-form", "Passwords do not match."); return; }

    const btn = document.getElementById("reset-btn");
    btn.disabled = true;
    btn.textContent = "Updating…";

    try {
      await resetPassword(resetToken, pass);
      document.getElementById("reset-form-wrap").style.display = "none";
      document.getElementById("reset-success").style.display = "block";
      setTimeout(() => { window.location.href = "index.html"; }, 2000);
    } catch (err) {
      showAuthError("reset-form", err.message);
      btn.disabled = false;
      btn.textContent = "Update password";
    }
  });
</script>
</body>
</html>
