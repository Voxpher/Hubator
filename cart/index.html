<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Hubator</title>
<meta name="description" content="Your shopping cart at Hubator.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.ico">
<meta property="og:title" content="Your Cart — Hubator">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>
<div id="site-header"></div>
<main id="main-content">
  <div class="wrap breadcrumb"><a href="/">Home</a> / Cart</div>
  <section class="page-hero" style="border-bottom:none;padding-bottom:0;">
    <div class="wrap"><h1>Your cart</h1></div>
  </section>
  <div class="wrap cart-grid" id="cart-root"></div>
</main>
<div id="site-footer"></div>
<script src="/js/maintenance.js"></script><script src="/js/layout.js"></script>
<script src="/js/config.js"></script>
<script src="/js/products.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/discount.js"></script>
<script src="/js/auth.js"></script>
<script>
  function renderCart() {
    const lines = cartLines();
    const root = document.getElementById("cart-root");
    root.innerHTML = "";

    if (!lines.length) {
      root.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="es-icon" style="color:var(--ink-soft)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div><h2>Your cart is empty</h2><p>Nothing here yet — go find something worth keeping.</p><a href="/shop" class="btn btn-primary">Browse the shop</a></div>';
      return;
    }

    const subtotal = cartSubtotal();

    // Lines column
    const linesCol = document.createElement("div");
    lines.forEach(function(l) {
      const line = document.createElement("div");
      line.className = "cart-line";

      const img = document.createElement("img");
      img.src = typeof safeProductImageUrl === "function" ? safeProductImageUrl(l.product.img) : "";
      img.alt = l.product.name;
      img.width = 76; img.height = 76;

      const info = document.createElement("div");
      const name = document.createElement("h4");
      const nameLink = document.createElement("a");
      nameLink.href = "/product?id=" + l.product.id;
      nameLink.textContent = l.product.name;
      name.appendChild(nameLink);
      const meta = document.createElement("div");
      meta.className = "cl-meta"; meta.textContent = l.product.category;
      const lineStock = l.variant && l.variant.stock != null ? l.variant.stock : l.product.stock;
      if (lineStock != null && lineStock < l.qty) {
        const unavailable = document.createElement("div");
        unavailable.className = "cl-meta";
        unavailable.style.color = "#b91c1c";
        unavailable.textContent = "Currently unavailable";
        info.appendChild(unavailable);
      }

      // Remove button (not anchor — semantic fix)
      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-btn";
      removeBtn.setAttribute("aria-label", "Remove " + l.product.name + " from cart");
      removeBtn.textContent = "Remove";
      removeBtn.onclick = function() {
        if (!window.confirm("Remove " + l.product.name + " from your cart?")) return;
        removeFromCart(l.product.id, l.variantId);
        renderCart();
      };

      info.appendChild(name); info.appendChild(meta);
      const variantLabel = [l.color, l.size].filter(Boolean).join(" / ");
      if (variantLabel) {
        const variantLine = document.createElement("div");
        variantLine.className = "cl-meta line-variant";
        variantLine.textContent = variantLabel;
        info.appendChild(variantLine);
      }
      info.appendChild(removeBtn);

      // Qty control
      const qtyCtrl = document.createElement("div");
      qtyCtrl.className = "qty-control";
      const decBtn = document.createElement("button");
      decBtn.setAttribute("type", "button");
      decBtn.setAttribute("aria-label", "Decrease quantity");
      decBtn.textContent = "−";
      decBtn.onclick = function() { setQty(l.product.id, l.qty - 1, l.variantId); renderCart(); };

      const qtyInput = document.createElement("input");
      qtyInput.type = "number"; // semantic fix: was type="text"
      qtyInput.value = String(l.qty);
      qtyInput.min = "1"; qtyInput.max = "99";
      qtyInput.setAttribute("aria-label", "Quantity for " + l.product.name);
      qtyInput.setAttribute("readonly", "");
      qtyInput.style.cssText = "width:44px;text-align:center;border:none;background:none;font-family:var(--font-mono);";

      const incBtn = document.createElement("button");
      incBtn.setAttribute("type", "button");
      incBtn.setAttribute("aria-label", "Increase quantity");
      incBtn.textContent = "+";
      const variantStock = l.variant && l.variant.stock != null ? l.variant.stock : l.product.lowestVariantStock;
      const stockLimit = variantStock != null ? Math.max(1, variantStock) : 99;
      if (l.qty >= stockLimit) incBtn.disabled = true;
      incBtn.onclick = function() { setQty(l.product.id, l.qty + 1, l.variantId); renderCart(); };

      qtyCtrl.appendChild(decBtn); qtyCtrl.appendChild(qtyInput); qtyCtrl.appendChild(incBtn);

      const price = document.createElement("span");
      price.className = "ticket";
      price.textContent = fmt(variantPriceOf(l.product, l.variant) * l.qty);

      line.appendChild(img); line.appendChild(info);
      line.appendChild(qtyCtrl); line.appendChild(price);
      linesCol.appendChild(line);
    });

    // Summary box
    const summary = document.createElement("div");
    summary.className = "summary-box";
    summary.setAttribute("aria-label", "Order summary");

    const sh = document.createElement("h3"); sh.textContent = "Order summary"; sh.style.marginBottom = "18px";
    summary.appendChild(sh);

    const subRow = document.createElement("div"); subRow.className = "summary-row";
    const subL = document.createElement("span"); subL.textContent = "Subtotal";
    const subV = document.createElement("span"); subV.textContent = fmt(subtotal);
    subRow.appendChild(subL); subRow.appendChild(subV); summary.appendChild(subRow);

    // Discount row (filled by renderDiscountState)
    const discRow = document.createElement("div"); discRow.className = "summary-row"; discRow.id = "discount-row"; discRow.style.display = "none";
    const discL = document.createElement("span"); discL.id = "discount-label"; discL.textContent = "Discount";
    const discV = document.createElement("span"); discV.id = "discount-value"; discV.style.color = "#166534"; discV.style.fontWeight = "700";
    discRow.appendChild(discL); discRow.appendChild(discV); summary.appendChild(discRow);

    const shipRow = document.createElement("div"); shipRow.className = "summary-row";
    const shipL = document.createElement("span"); shipL.textContent = "Shipping";
    const shipV = document.createElement("span"); shipV.id = "shipping-value"; shipV.textContent = "Calculated at checkout";
    shipRow.appendChild(shipL); shipRow.appendChild(shipV); summary.appendChild(shipRow);

    // Promo zone (input or applied-code chip — rendered by renderDiscountState)
    const promoZone = document.createElement("div"); promoZone.id = "promo-zone"; promoZone.style.margin = "14px 0 4px";
    summary.appendChild(promoZone);

    const totalRow = document.createElement("div"); totalRow.className = "summary-row total";
    const tl = document.createElement("span"); tl.textContent = "Total";
    const tv = document.createElement("span"); tv.id = "total-value"; tv.textContent = fmt(subtotal);
    totalRow.appendChild(tl); totalRow.appendChild(tv); summary.appendChild(totalRow);

    const checkoutLink = document.createElement("a"); checkoutLink.href = "/checkout"; checkoutLink.className = "btn btn-primary btn-block"; checkoutLink.textContent = "Checkout"; checkoutLink.style.marginTop = "16px";
    const continueLink = document.createElement("a"); continueLink.href = "/shop"; continueLink.className = "btn btn-outline btn-block"; continueLink.textContent = "Continue shopping"; continueLink.style.marginTop = "10px";
    // Soft sign-in nudge for guest users (never blocking)
if (typeof isSignedIn === "function" && !isSignedIn()) {
  var nudge = document.createElement("p");
  nudge.style.cssText = "font-size:0.82rem;color:var(--ink-soft);text-align:center;margin:12px 0 0;";
  var nudgeLink = document.createElement("a");
  nudgeLink.href = "/login?next=%2Fcart";
  nudgeLink.textContent = "Sign in";
  nudgeLink.style.color = "var(--gold-deep)";
  nudgeLink.style.fontWeight = "600";
  nudge.appendChild(document.createTextNode("Have an account? "));
  nudge.appendChild(nudgeLink);
  nudge.appendChild(document.createTextNode(" for faster checkout"));
  summary.appendChild(nudge);
}
summary.appendChild(checkoutLink); summary.appendChild(continueLink);

    root.appendChild(linesCol); root.appendChild(summary);
    renderDiscountState();
  }

  // ── Discount code UI ──────────────────────────────────────────────
  // Re-validates the applied code against the live cart and updates the
  // promo zone, discount row, shipping hint and total.
  function renderDiscountState() {
    var promoZone = document.getElementById("promo-zone");
    var discRow = document.getElementById("discount-row");
    var discLabel = document.getElementById("discount-label");
    var discValue = document.getElementById("discount-value");
    var totalValue = document.getElementById("total-value");
    var shipValue = document.getElementById("shipping-value");
    if (!promoZone) return;
    var subtotal = cartSubtotal();
    var code = typeof getAppliedDiscountCode === "function" ? getAppliedDiscountCode() : "";

    function paintPlain() {
      if (discRow) discRow.style.display = "none";
      if (totalValue) totalValue.textContent = fmt(subtotal);
      if (shipValue) shipValue.textContent = "Calculated at checkout";
    }

    function paintInput() {
      paintPlain();
      promoZone.innerHTML = "";
      var row = document.createElement("div"); row.className = "promo-row";
      var input = document.createElement("input");
      input.type = "text"; input.placeholder = "Promo code";
      input.setAttribute("aria-label", "Promo code");
      input.autocapitalize = "characters"; input.autocomplete = "off"; input.spellcheck = false;
      var btn = document.createElement("button");
      btn.className = "btn btn-outline btn-sm"; btn.textContent = "Apply"; btn.type = "button";
      function apply() {
        var c = input.value.trim();
        if (!c) { showToast("Enter a promo code first."); return; }
        btn.disabled = true; btn.textContent = "Checking…";
        if (typeof setAppliedDiscountCode === "function") setAppliedDiscountCode(c);
        validateAppliedDiscount().then(function(r) {
          if (r.valid) {
            showToast("Code applied: " + r.summary);
          } else {
            if (typeof clearAppliedDiscountCode === "function") clearAppliedDiscountCode();
            showToast(r.reason || "This code is not valid.");
          }
          renderDiscountState();
        });
      }
      btn.onclick = apply;
      input.addEventListener("keydown", function(e) { if (e.key === "Enter") { e.preventDefault(); apply(); } });
      row.appendChild(input); row.appendChild(btn);
      promoZone.appendChild(row);
    }

    if (!code) { paintInput(); return; }

    // Code stored — show it while validating
    promoZone.innerHTML = "";
    var chip = document.createElement("div");
    chip.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f4f1e8;border:1px dashed #c9bfa8;border-radius:8px;padding:9px 12px;";
    var chipLabel = document.createElement("span");
    chipLabel.style.cssText = "font-family:var(--font-mono);font-weight:700;letter-spacing:0.06em;font-size:0.85rem;";
    chipLabel.textContent = code;
    var checking = document.createElement("span");
    checking.style.cssText = "font-size:0.8rem;color:var(--ink-soft);";
    checking.textContent = "Checking…";
    var removeBtn = document.createElement("button");
    removeBtn.type = "button"; removeBtn.textContent = "Remove";
    removeBtn.setAttribute("aria-label", "Remove promo code " + code);
    removeBtn.style.cssText = "background:none;border:none;color:#b91c1c;font-size:0.82rem;font-weight:600;cursor:pointer;padding:4px;";
    removeBtn.onclick = function() {
      if (typeof clearAppliedDiscountCode === "function") clearAppliedDiscountCode();
      renderDiscountState();
    };
    var right = document.createElement("span");
    right.style.cssText = "display:flex;align-items:center;gap:8px;";
    right.appendChild(checking); right.appendChild(removeBtn);
    chip.appendChild(chipLabel); chip.appendChild(right);
    promoZone.appendChild(chip);

    validateAppliedDiscount().then(function(r) {
      // Cart or code may have changed while we were validating
      if (typeof getAppliedDiscountCode === "function" && getAppliedDiscountCode() !== code) return;
      if (!document.getElementById("promo-zone")) return;
      if (!r.valid) {
        if (typeof clearAppliedDiscountCode === "function") clearAppliedDiscountCode();
        if (r.reason) showToast(r.reason);
        renderDiscountState();
        return;
      }
      // Valid — paint the discount
      promoZone.innerHTML = "";
      var okChip = document.createElement("div");
      okChip.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:10px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:9px 12px;";
      var okLabel = document.createElement("span");
      okLabel.style.cssText = "font-family:var(--font-mono);font-weight:700;letter-spacing:0.06em;font-size:0.85rem;color:#065f46;";
      okLabel.textContent = r.code + " — " + r.summary;
      var okRemove = document.createElement("button");
      okRemove.type = "button"; okRemove.textContent = "Remove";
      okRemove.setAttribute("aria-label", "Remove promo code " + r.code);
      okRemove.style.cssText = "background:none;border:none;color:#b91c1c;font-size:0.82rem;font-weight:600;cursor:pointer;padding:4px;";
      okRemove.onclick = function() {
        if (typeof clearAppliedDiscountCode === "function") clearAppliedDiscountCode();
        showToast("Promo code removed.");
        renderDiscountState();
      };
      okChip.appendChild(okLabel); okChip.appendChild(okRemove);
      promoZone.appendChild(okChip);

      if (discRow && discLabel && discValue) {
        discRow.style.display = "";
        discLabel.textContent = "Discount (" + r.code + ")";
        discValue.textContent = r.discountAmount > 0 ? "−" + fmt(r.discountAmount) : "Applied";
      }
      if (shipValue) shipValue.textContent = r.freeShipping ? "FREE" : "Calculated at checkout";
      if (totalValue) totalValue.textContent = fmt(Math.max(0, subtotal - r.discountAmount));
    });
  }

  loadProducts().then(renderCart).catch(function(err) {
    console.error("[Hubator] cart:", err);
    document.getElementById("cart-root").textContent = "We couldn't load your cart. Please refresh and try again.";
  });
  window.addEventListener("hubator:products-loaded", renderCart);
  window.addEventListener("hubator:cart-changed", function() { renderCart(); });
  window.addEventListener("hubator:discount-changed", function() { renderDiscountState(); });
</script>
</body>
</html>
