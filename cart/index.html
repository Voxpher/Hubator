<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Hubator</title>
<meta name="description" content="Your shopping cart at Hubator.">
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.ico">
<meta property="og:title" content="Your Cart — Hubator">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hubator">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main-content">
  <div class="wrap breadcrumb"><a href="/">Home</a> / Cart</div>
  <section class="page-hero" style="border-bottom:none;padding-bottom:0;">
    <div class="wrap"><h1>Your cart</h1></div>
  </section>
  <div class="wrap cart-grid" id="cart-root"></div>
</main>
<div id="site-footer"></div>
<script src="/js/maintenance.js"></script><script src="/js/layout.js"></script>
<script src="/js/config.js"></script>
<script src="/js/products.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>
<script>
  function renderCart() {
    const lines = cartLines();
    const root = document.getElementById("cart-root");
    root.innerHTML = "";

    if (!lines.length) {
      root.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="es-icon" style="color:var(--ink-soft)"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div><h2>Your cart is empty</h2><p>Nothing here yet \u2014 go find something worth keeping.</p><a href="/shop" class="btn btn-primary">Browse the shop</a></div>';
      return;
    }

    const subtotal = cartSubtotal();

    // Lines column
    const linesCol = document.createElement("div");
    lines.forEach(function(l) {
      const line = document.createElement("div");
      line.className = "cart-line";

      const img = document.createElement("img");
      img.src = typeof safeProductImageUrl === "function" ? safeProductImageUrl(l.product.img) : "";
      img.alt = l.product.name;
      img.width = 76; img.height = 76;

      const info = document.createElement("div");
      const name = document.createElement("h4");
      const nameLink = document.createElement("a");
      nameLink.href = "/product?id=" + l.product.id;
      nameLink.textContent = l.product.name;
      name.appendChild(nameLink);
      const meta = document.createElement("div");
      meta.className = "cl-meta"; meta.textContent = l.product.category;
      if (l.product.stock != null && l.product.stock < l.qty) {
        const unavailable = document.createElement("div");
        unavailable.className = "cl-meta";
        unavailable.style.color = "#b91c1c";
        unavailable.textContent = "Currently unavailable";
        info.appendChild(unavailable);
      }

      // Remove button (not anchor — semantic fix)
      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-btn";
      removeBtn.setAttribute("aria-label", "Remove " + l.product.name + " from cart");
      removeBtn.textContent = "Remove";
      removeBtn.onclick = function() {
        if (!window.confirm("Remove " + l.product.name + " from your cart?")) return;
        removeFromCart(l.product.id);
        renderCart();
      };

      info.appendChild(name); info.appendChild(meta); info.appendChild(removeBtn);

      // Qty control
      const qtyCtrl = document.createElement("div");
      qtyCtrl.className = "qty-control";
      const decBtn = document.createElement("button");
      decBtn.setAttribute("type", "button");
      decBtn.setAttribute("aria-label", "Decrease quantity");
      decBtn.textContent = "−";
      decBtn.onclick = function() { setQty(l.product.id, l.qty - 1); renderCart(); };

      const qtyInput = document.createElement("input");
      qtyInput.type = "number"; // semantic fix: was type="text"
      qtyInput.value = String(l.qty);
      qtyInput.min = "1"; qtyInput.max = "20";
      qtyInput.setAttribute("aria-label", "Quantity for " + l.product.name);
      qtyInput.setAttribute("readonly", "");
      qtyInput.style.cssText = "width:44px;text-align:center;border:none;background:none;font-family:var(--font-mono);";

      const incBtn = document.createElement("button");
      incBtn.setAttribute("type", "button");
      incBtn.setAttribute("aria-label", "Increase quantity");
      incBtn.textContent = "+";
      if (l.product.stock != null && l.qty >= l.product.stock) incBtn.disabled = true;
      incBtn.onclick = function() { setQty(l.product.id, l.qty + 1); renderCart(); };

      qtyCtrl.appendChild(decBtn); qtyCtrl.appendChild(qtyInput); qtyCtrl.appendChild(incBtn);

      const price = document.createElement("span");
      price.className = "ticket";
      price.textContent = fmt(l.product.price * l.qty);

      line.appendChild(img); line.appendChild(info);
      line.appendChild(qtyCtrl); line.appendChild(price);
      linesCol.appendChild(line);
    });

    // Summary box
    const summary = document.createElement("div");
    summary.className = "summary-box";
    summary.setAttribute("aria-label", "Order summary");

    const sh = document.createElement("h3"); sh.textContent = "Order summary"; sh.style.marginBottom = "18px";
    summary.appendChild(sh);

    [["Subtotal", fmt(subtotal)], ["Shipping", "Calculated at checkout"]].forEach(function(pair) {
      const r = document.createElement("div"); r.className = "summary-row";
      const l = document.createElement("span"); l.textContent = pair[0];
      const v = document.createElement("span"); v.textContent = pair[1];
      r.appendChild(l); r.appendChild(v); summary.appendChild(r);
    });

    const promoRow = document.createElement("div"); promoRow.className = "promo-row";
    const promoInput = document.createElement("input"); promoInput.type = "text"; promoInput.placeholder = "Promo code"; promoInput.setAttribute("aria-label", "Promo code");
    const promoBtn = document.createElement("button"); promoBtn.className = "btn btn-outline btn-sm"; promoBtn.textContent = "Apply"; promoBtn.type = "button";
    promoBtn.onclick = function() { showToast("Promo codes are not available for this order."); };
    promoRow.appendChild(promoInput); promoRow.appendChild(promoBtn); summary.appendChild(promoRow);

    const totalRow = document.createElement("div"); totalRow.className = "summary-row total";
    const tl = document.createElement("span"); tl.textContent = "Total";
    const tv = document.createElement("span"); tv.textContent = fmt(subtotal);
    totalRow.appendChild(tl); totalRow.appendChild(tv); summary.appendChild(totalRow);

    const checkoutLink = document.createElement("a"); checkoutLink.href = "/checkout"; checkoutLink.className = "btn btn-primary btn-block"; checkoutLink.textContent = "Checkout"; checkoutLink.style.marginTop = "16px";
    const continueLink = document.createElement("a"); continueLink.href = "/shop"; continueLink.className = "btn btn-outline btn-block"; continueLink.textContent = "Continue shopping"; continueLink.style.marginTop = "10px";
    // Soft sign-in nudge for guest users (never blocking)
if (typeof isSignedIn === "function" && !isSignedIn()) {
  var nudge = document.createElement("p");
  nudge.style.cssText = "font-size:0.82rem;color:var(--ink-soft);text-align:center;margin:12px 0 0;";
  var nudgeLink = document.createElement("a");
  nudgeLink.href = "/login?next=%2Fcart";
  nudgeLink.textContent = "Sign in";
  nudgeLink.style.color = "var(--gold-deep)";
  nudgeLink.style.fontWeight = "600";
  nudge.appendChild(document.createTextNode("Have an account? "));
  nudge.appendChild(nudgeLink);
  nudge.appendChild(document.createTextNode(" for faster checkout"));
  summary.appendChild(nudge);
}
summary.appendChild(checkoutLink); summary.appendChild(continueLink);

    root.appendChild(linesCol); root.appendChild(summary);
  }

  loadProducts().then(renderCart).catch(function(err) {
    console.error("[Hubator] cart:", err);
    document.getElementById("cart-root").textContent = "We couldn't load your cart. Please refresh and try again.";
  });
  window.addEventListener("hubator:products-loaded", renderCart);
  window.addEventListener("hubator:cart-changed", renderCart);
</script>
</body>
</html>
