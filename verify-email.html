<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify email — Hubator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-bar">
    <a href="index.html" class="logo">Hubator</a>
    <nav class="main-nav"><ul><li><a href="shop.html">Shop</a></li></ul></nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-link" aria-label="Cart">🛍️<span class="cart-count">0</span></a>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center;">

      <!-- Loading state -->
      <div id="verify-loading">
        <div style="font-size:2.5rem;margin-bottom:1rem;">⏳</div>
        <h2 style="margin:0 0 0.5rem;">Verifying your email…</h2>
        <p style="color:#6b7280;">Please wait a moment.</p>
      </div>

      <!-- Success state -->
      <div id="verify-success" style="display:none;">
        <div style="font-size:2.5rem;margin-bottom:1rem;">✅</div>
        <h2 style="margin:0 0 0.5rem;">Email verified!</h2>
        <p style="color:#6b7280;margin:0 0 1.5rem;">
          Your account is now active. You're signed in and being redirected to the homepage…
        </p>
      </div>

      <!-- Error state -->
      <div id="verify-error" style="display:none;">
        <div style="font-size:2.5rem;margin-bottom:1rem;">❌</div>
        <h2 style="margin:0 0 0.5rem;">Verification failed</h2>
        <p id="verify-error-msg" style="color:#6b7280;margin:0 0 1.5rem;"></p>
        <a href="signup.html" class="btn btn-primary btn-block">Create a new account</a>
      </div>

    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© 2026 Hubator. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
  (async function () {
    const token = new URLSearchParams(location.search).get("token");

    if (!token || token.length !== 64) {
      document.getElementById("verify-loading").style.display = "none";
      document.getElementById("verify-error").style.display = "block";
      document.getElementById("verify-error-msg").textContent =
        "Invalid verification link. Please sign up again or contact support.";
      return;
    }

    try {
      const res = await fetch(hubatorApiUrl("/api/public/auth/verify-email"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) throw new Error(data.error || "Verification failed.");

      // Save session and redirect
      localStorage.setItem("hubator_token", data.token);
      localStorage.setItem("hubator_customer", JSON.stringify(data.customer));

      document.getElementById("verify-loading").style.display = "none";
      document.getElementById("verify-success").style.display = "block";

      setTimeout(() => { window.location.href = "index.html"; }, 2000);
    } catch (err) {
      document.getElementById("verify-loading").style.display = "none";
      document.getElementById("verify-error").style.display = "block";
      document.getElementById("verify-error-msg").textContent = err.message;
    }
  })();
</script>
</body>
</html>
